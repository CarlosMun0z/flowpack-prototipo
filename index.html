        danger: 'bg-[#991B1B] border-[#FCA5A5] text-white',
        warning: 'bg-[#92400E] border-[#FCD34D] text-white',
        info: 'bg-[#14252B] border-[#67D2EA] text-white',
      };

      const el = document.createElement('div');
      el.className = `pointer-events-auto rounded-2xl border-l-4 p-4 shadow-xl transition-all duration-200 ${styles[variant] || styles.info}`;
      el.innerHTML = `
        <div class="flex items-start justify-between gap-3">
          <div>
            <p class="font-heading text-xs font-bold uppercase tracking-wider opacity-90">${title}</p>
            <p class="text-sm font-medium mt-0.5 leading-snug">${message}</p>
          </div>
          <button onclick="this.parentElement.parentElement.remove()" class="text-xs opacity-75 hover:opacity-100 font-bold px-1.5 py-0.5 rounded">✕</button>
        </div>
      `;
      stack.appendChild(el);
      setTimeout(() => {
        if (el.parentElement) el.remove();
      }, 4200);
    }

    /**
     * Genera código QR determinístico en SVG para etiquetas térmicas 10x15 cm
     */
    function generateQrSvg(text, size = 156) {
      const grid = 21;
      const cell = size / grid;
      let hash = 2166136261;
      for (let i = 0; i < text.length; i++) {
        hash ^= text.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }

      const isFinder = (r, c) =>
        (r < 7 && c < 7) || (r < 7 && c >= grid - 7) || (r >= grid - 7 && c < 7);

      const isFinderDark = (r, c) => {
        const lr = r < 7 ? r : r - (grid - 7);
        const lc = c < 7 ? c : c - (grid - 7);
        return lr === 0 || lr === 6 || lc === 0 || lc === 6 || (lr >= 2 && lr <= 4 && lc >= 2 && lc <= 4);
      };

      let rects = `<rect width="${size}" height="${size}" fill="#FFFFFF"/>`;
      for (let r = 0; r < grid; r++) {
        for (let c = 0; c < grid; c++) {
          let dark = false;
          if (isFinder(r, c)) {
            dark = isFinderDark(r, c);
          } else if (r === 6 || c === 6) {
            dark = (r + c) % 2 === 0;
          } else {
            const v = Math.abs(Math.imul(hash ^ (r * 31 + c * 17), 2654435761));
            dark = v % 100 < 48;
          }
          if (dark) {
            rects += `<rect x="${(c * cell).toFixed(2)}" y="${(r * cell).toFixed(2)}" width="${(cell + 0.25).toFixed(2)}" height="${(cell + 0.25).toFixed(2)}" fill="#111C17"/>`;
          }
        }
      }

      return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg" class="border border-[#111C17] rounded-md bg-white">${rects}</svg>`;
    }

       4. ACCIONES DE SESIÓN Y NAVEGACIÓN ENTRE ESTACIONES

    function handleCredentialLogin(event) {
      event.preventDefault();
      const email = document.getElementById('login-email-input').value.trim().toLowerCase();
      const password = document.getElementById('login-pass-input').value.trim();

      state.loginEmail = email;
      state.loginPassword = password;

      const found = PROFILES.find((p) => p.email.toLowerCase() === email);
      if (!found || !password) {
        state.loginError = 'Credenciales inválidas. Verifica tu correo corporativo o selecciona una estación abajo.';
        render();
        return;
      }

      state.loginError = '';
      state.activeProfileId = found.id;
      state.isAuthenticated = true;
      pushAudit('Acceso estación', `${found.name} · ${found.role}`, 'info');
      showToast('Sesión iniciada', `Bienvenido a planta, ${found.name} (${found.role}).`, 'success');
      render();
    }

    function loginByStationCard(profileId) {
      const found = PROFILES.find((p) => p.id === profileId);
      if (!found) return;

      state.activeProfileId = found.id;
      state.loginEmail = found.email;
      state.loginPassword = found.pass;
      state.loginError = '';
      state.isAuthenticated = true;

      pushAudit('Acceso estación', `${found.name} · ${found.role}`, 'info');
      showToast('Estación activada', `${found.name} — ${found.role}`, 'success');
      render();
    }

    function switchActiveProfile(newId) {
      const found = PROFILES.find((p) => p.id === newId);
      if (!found) return;
      state.activeProfileId = found.id;
      pushAudit('Cambio de estación', `${found.name} · ${found.role}`, 'info');
      showToast('Cambio de perfil', `Estación activa: ${found.role}`, 'info');
      render();
    }

    function handleLogout() {
      const current = getActiveProfile();
      pushAudit('Cierre de sesión', `${current.name} · Turno A`, 'info');
      state.isAuthenticated = false;
      state.loginError = '';
      render();
    }

    function saveNewCatalogEntry(event) {

    function submitQualityVerdict(event) {
      event.preventDefault();
      const lot = state.lots.find((l) => l.id === state.ui.qualitySelectedLotId);
      if (!lot) return;

      const brix = parseFloat(document.getElementById('qc-brix-input').value) || 0;
      const firmness = parseInt(document.getElementById('qc-firmness-input').value, 10) || 0;
      const defects = parseFloat(document.getElementById('qc-defects-input').value) || 0;
      const justification = document.getElementById('qc-reason-input').value.trim();
      const errBox = document.getElementById('qc-validation-msg');

      if (!justification) {
        errBox.classList.remove('hidden');
        document.getElementById('qc-reason-input').focus();
        showToast('Justificación requerida', 'Describe los hallazgos técnicos antes de registrar el dictamen.', 'danger');
        return;
      }

      errBox.classList.add('hidden');
      const verdict = state.ui.qualityDraftVerdict;

      lot.status = verdict;
      lot.reason = justification;
      lot.quality = {
        brix,
        firmness,
        defects,
        photo: state.ui.qualityPhotoTaken,
        photoTime: state.ui.qualityPhotoTime || `17 Nov 2026 · ${nowTimeStr().slice(0, 5)}`,
        inspector: 'Camila Valdés',
      };

      const logTitle =
        verdict === 'ACEPTADO'
          ? 'Lote aprobado'
          : verdict === 'RECHAZADO'
          ? 'Lote rechazado'
          : 'Lote observado';

      pushAudit(logTitle, `${lot.id} · ${justification.slice(0, 34)}`, verdict === 'ACEPTADO' ? 'success' : 'danger');
      showToast(
        `Dictamen: ${verdict}`,
        `El lote ${lot.id} ha sido actualizado en todas las estaciones de planta.`,
        verdict === 'ACEPTADO' ? 'success' : 'danger'
      );
      render();
    }

      if (next) {
        state.ui.pdaSelectedPalletId = next.id;

    function confirmPdaLocation() {
      const pallet = state.pallets.find((p) => p.id === state.ui.pdaSelectedPalletId);
      const rack = state.ui.pdaSelectedRack;
      if (!pallet) return;

      const shortRack = rack.replace(' · ', ' / ');

      if (state.pdaOnline) {
        pallet.location = rack;
        pallet.syncStatus = 'SINCRONIZADO';
        pushAudit('Ubicación asignada', `${pallet.id} · ${shortRack}`, 'info');
        showToast('Ubicación confirmada', `${pallet.id} asignado a ${rack}.`, 'success');
      } else {
        state.sqliteQueue.push({
          id: `SQL-${state.sqliteQueue.length + 1}`,
          palletId: pallet.id,
          rack,
          time: nowTimeStr(),
        });
        pallet.location = `${rack} (Local)`;
        pallet.syncStatus = 'PENDIENTE SQLITE';
        pushAudit('Guardado en SQLite', `${pallet.id} · ${shortRack} (Offline)`, 'warning');
        showToast(
          'Guardado en cola local SQLite',
          `${pallet.id} almacenado localmente (${state.sqliteQueue.length} / 10.000).`,
          'warning'
        );
      }
      render();
    }

    function syncSqlitePending() {
      if (!state.pdaOnline) {
        showToast('Sin conexión Wi-Fi', 'Activa la conexión Wi-Fi Planta en la esquina superior derecha para sincronizar.', 'danger');
        return;
      }
      if (state.sqliteQueue.length === 0 || state.pdaSyncing) return;

      state.pdaSyncing = true;
      render();

      const count = state.sqliteQueue.length;
      setTimeout(() => {
        state.sqliteQueue.forEach((entry) => {
          const p = state.pallets.find((item) => item.id === entry.palletId);
          if (p) {
            p.location = entry.rack;
            p.syncStatus = 'SINCRONIZADO';
          }
        });
        state.sqliteQueue = [];
        state.pdaSyncing = false;
        pushAudit('Sincronización SQLite', `${count} registro(s) consolidados en servidor`, 'success');
        showToast('Sincronización completada', `${count} registro(s) enviados al servidor central.`, 'success');
        render();
      }, 900);
    }

                        : 'bg-[#111F24] border-[#213A42] text-slate-500'
                    }"

    // --- 7.6 PORTAL EXPORTADOR (Valle Sur S.A.) ---
    function renderExporterView() {
      const clientCompany = 'Valle Sur S.A.';
      const query = state.ui.exporterSearch.toLowerCase();

      // Aislamiento estricto RLS: solo lotes y pallets del exportador autenticado
      const clientLots = state.lots.filter(
        (l) =>
          l.exporter === clientCompany &&
          (l.id.toLowerCase().includes(query) ||
            l.variety.toLowerCase().includes(query) ||
            l.producer.toLowerCase().includes(query))
      );

      const allClientLots = state.lots.filter((l) => l.exporter === clientCompany);
      const clientPallets = state.pallets.filter((p) => p.exporter === clientCompany);

      const approvedKg = allClientLots
        .filter((l) => l.status === 'ACEPTADO')
        .reduce((acc, l) => acc + l.weightKg, 0);
      const approvedTons = (approvedKg / 1000).toFixed(1);

      return `
        <!-- Encabezado Portal Cliente -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
          <div>
            <p class="font-mono text-xs font-bold uppercase tracking-[0.12em] text-[#157A45] mb-1">
              PORTAL CLIENTE · TEMPORADA 2026
            </p>
            <h1 class="font-heading text-3xl sm:text-4xl font-extrabold text-[#111C17] tracking-tight">
              Buenos días, Valle Sur

            <p class="text-sm text-[#5C6F65] mt-1">
              Visibilidad en tiempo real de su fruta en proceso.

          </div>

            </svg>
            <div class="font-mono">
              <p class="text-[11px] font-bold uppercase text-[#157A45]">DATOS PROTEGIDOS</p>
              <p class="text-[10px] font-semibold text-[#5C6F65]">VISTA EXCLUSIVA VALLE SUR S.A.</p>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
          <div class="card-surface p-5 flex items-center gap-4">
            <div class="w-12 h-12 rounded-2xl bg-[#E6F5EC] text-[#157A45] flex items-center justify-center shrink-0">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
              </svg>

            <div>
              <p class="font-mono text-[11px] font-bold uppercase tracking-wider text-[#5C6F65]">LOTES TOTALES</p>
              <p class="font-mono text-2xl sm:text-3xl font-bold text-[#111C17] mt-0.5">${allClientLots.length}</p>
              <p class="text-xs text-[#5C6F65] mt-0.5">Asignados a su cuenta</p>
            </div>
          </div>

          <div class="card-surface p-5 flex items-center gap-4">
            <div class="w-12 h-12 rounded-2xl bg-[#EBF3FA] text-[#2563EB] flex items-center justify-center shrink-0">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">

              <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">

              <p class="font-mono text-2xl sm:text-3xl font-bold text-[#111C17] mt-0.5">${clientPallets.length}</p>
              <p class="text-xs text-[#5C6F65] mt-0.5">${clientPallets.filter((p) => p.location !== 'Sin asignar').length} ubicados en cámara</p>

        <!-- Tarjeta 01 Trazabilidad de su inventario -->

              <input

              />

            ${clientLots
              .map((lot) => {
                const lotPallets = clientPallets.filter((p) => p.lotId === lot.id);
                const qualitySummary = lot.quality
                  ? `${lot.quality.brix} °Brix · ${lot.quality.defects}% defectos`
                  : 'En análisis';

                return `
                <div class="rounded-2xl border border-[#E4EAE5] bg-white p-5 flex flex-col justify-between">
                  <div>
                    <div class="flex items-start justify-between gap-3 mb-4">
                      <div class="flex items-center gap-3">
                        <div class="w-11 h-11 rounded-xl bg-[#F2F9F5] text-[#157A45] flex items-center justify-center shrink-0">
                          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z" />
                          </svg>
                        </div>
                        <div>
                          <h3 class="text-base font-bold text-[#111C17]">${lot.variety}</h3>
                          <p class="font-mono text-xs text-[#5C6F65]">${lot.id} · ${lot.producer}</p>
                        </div>
                      </div>
                      ${renderBadge(lot.status)}
                    </div>

                    <!-- Caja interior gris suave con 4 métricas -->
                    <div class="rounded-xl bg-[#F6F8F6] p-4 grid grid-cols-2 gap-y-3 gap-x-4 text-xs">
                      <div>

                        <p class="font-bold text-[#111C17] mt-0.5">${lot.date}</p>
                      </div>
                      <div>
                        <p class="text-[#5C6F65]">Peso recibido</p>

                      </div>
                      <div>
                        <p class="text-[#5C6F65]">Resultado calidad</p>

                        <p class="text-[#5C6F65]">Producción</p>

                    <div class="mt-4 pt-2 divide-y divide-[#E4EAE5]">

                          (p) => `

                        .join('')}
                    </div>
                  `
                      : ''
                  }
                </div>
              `;
              })
              .join('')}
          </div>
        </section>
      `;
    }

    /* ==========================================================================
       8. ORQUESTADOR DE RENDERIZADO GLOBAL
       ========================================================================== */

    function render() {
      const root = document.getElementById('app');
      if (!root) return;

      if (!state.isAuthenticated) {
        root.innerHTML = renderLoginView();
        return;
      }

      let stationHtml = '';
      switch (state.activeProfileId) {
        case 'admin':
          stationHtml = renderAdminView();
          break;
        case 'quality':
          stationHtml = renderQualityView();
          break;
        case 'operator':
          stationHtml = renderReceptionView();
          break;
        case 'pda':
          stationHtml = renderPdaArcticView();
          break;
        case 'warehouse':
          stationHtml = renderWarehouseView();
          break;
        case 'exporter':
          stationHtml = renderExporterView();
          break;
        default:
          stationHtml = renderAdminView();
      }

      root.innerHTML = `
        ${renderGlobalHeader()}
        <main class="flex-grow max-w-[1440px] w-full mx-auto px-4 sm:px-6 pt-6 pb-24">
          ${stationHtml}
        </main>
        ${renderLiveAuditBar()}
      `;
    }

    window.addEventListener('DOMContentLoaded', () => {
      render();
    });
  </script>
