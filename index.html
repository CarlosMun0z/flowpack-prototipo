    body {

      overflow-x: hidden;
    }

    /* Botones táctiles industriales (>= 80px para frío a -2 °C y acciones críticas) */
    .btn-touch-80 {
      min-height: 80px;
      padding: 1rem 1.25rem;
      transition: transform 0.08s ease, background-color 0.15s ease, border-color 0.15s ease;
      touch-action: manipulation;
      user-select: none;
    }
    .btn-touch-80:active:not(:disabled) {
      transform: scale(0.99);
    }
    .btn-touch-80:disabled {
      cursor: not-allowed;
    }

    .btn-industrial {
      min-height: 48px;
      transition: transform 0.08s ease, background-color 0.15s ease, border-color 0.15s ease;
      touch-action: manipulation;
      user-select: none;
    }
    .btn-industrial:active:not(:disabled) {
      transform: scale(0.99);
    }
    .btn-industrial:disabled {
      cursor: not-allowed;
    }

    .field-industrial {
      min-height: 48px;
      border: 1.5px solid #C8D4CC;
      border-radius: 12px;
      background-color: #FFFFFF;
      color: #111C17;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 0.6rem 0.85rem;
      width: 100%;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .field-industrial:focus {
      outline: none;
      border-color: #0E3B25;
      box-shadow: 0 0 0 3px rgba(14, 59, 37, 0.15);
    }

    .card-industrial {
      background-color: #FFFFFF;
      border: 1px solid #E2E8E4;
      border-radius: 16px;
      box-shadow: 0 2px 10px -2px rgba(17, 28, 23, 0.04);
    }

    .thermal-label {
      width: 100%;
      max-width: 390px;
      background: #FFFFFF;
      border: 2px solid #111C17;
      border-radius: 14px;
      box-shadow: 0 14px 30px -10px rgba(14, 59, 37, 0.18);
      font-family: 'JetBrains Mono', monospace;
    }

    @keyframes pulseRedBorder {
      0%, 100% { box-shadow: 0 0 0 0 rgba(200, 35, 51, 0.45); }
      50% { box-shadow: 0 0 0 14px rgba(200, 35, 51, 0); }
    }
    .alarm-pulse {
      animation: pulseRedBorder 1.1s infinite;
    }

    @media print {
      header, footer, #toast-container, .no-print {
        display: none !important;
      }
      body {
        background: #FFFFFF !important;

    function loadPersistedState() {
      const defaults = createDefaultState();
      try {
        const raw = localStorage.getItem(APP_STORAGE_KEY);
        if (!raw) return defaults;
        const saved = JSON.parse(raw);
        if (!saved || typeof saved !== 'object') return defaults;
        return {
          ...defaults,
          ...saved,
          catalogs: { ...defaults.catalogs, ...(saved.catalogs || {}) },
          ui: { ...defaults.ui, ...(saved.ui || {}) },
        };
      } catch (e) {
        return defaults;
      }
    }

    function saveState() {
      try {
        localStorage.setItem(APP_STORAGE_KEY, JSON.stringify(appState));
      } catch (e) {
        // Ignorar si almacenamiento lleno
      }
    }

    function executeSystemResetWithPassword(event) {
      event.preventDefault();

    function formatChileanRut(raw) {
      const clean = raw.replace(/[^0-9kK]/g, '').toUpperCase();
      if (clean.length < 2) return clean;
      const body = clean.slice(0, -1);
      const dv = clean.slice(-1);
      const formattedBody = body.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      return `${formattedBody}-${dv}`;
    }

    function isValidChileanRutFormat(rut) {
      return /^\d{1,2}\.\d{3}\.\d{3}-[0-9K]$/.test(rut.trim().toUpperCase());
    }

    function playIndustrialAlarmSound() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;

        [0, 0.22, 0.44].forEach((offset) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(880, now + offset);
          osc.frequency.exponentialRampToValueAtTime(520, now + offset + 0.17);
          gain.gain.setValueAtTime(0.24, now + offset);
          gain.gain.exponentialRampToValueAtTime(0.01, now + offset + 0.18);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + offset);
          osc.stop(now + offset + 0.19);
        });
      } catch (e) {
        // Ignorar si navegador restringe audio
      }
    }

    function computeActiveOperationalAlerts() {
      const alerts = [];

      appState.lots
        .filter((l) => l.status === 'OBSERVADO' && (l.detainedHours || 0) >= 24)
        .forEach((l) => {
          const id = `ALT-LOT-${l.id}`;
          if (!appState.resolvedAlerts.includes(id)) {
            alerts.push({
              id,
              severity: 'ALTA',
              category: 'CALIDAD · LOTE DETENIDO > 24 H',
              title: `Lote ${l.id} (${l.species} ${l.variety}) detenido hace ${l.detainedHours} h`,
              detail: `${l.producer} · ${l.reason}`,
            });
          }
        });

      appState.warehouseStock.forEach((m) => {
        const net = m.physical - m.committed;
        if (net <= m.minAlert) {
          const id = `ALT-STK-${m.code}`;
          if (!appState.resolvedAlerts.includes(id)) {
            alerts.push({
              id,
              severity: 'MEDIA',
              category: 'BODEGA · QUIEBRE INMINENTE',
              title: `Stock bajo en ${m.name} (${m.code})`,
              detail: `Disponible neto: ${fmtNum(net)} ${m.unit} (umbral mínimo: ${fmtNum(m.minAlert)} ${m.unit}).`,
            });
          }
        }
      });

      appState.dispatchOrders
        .filter((d) => d.status !== 'EMBARCADO')
        .forEach((d) => {
          const id = `ALT-DSP-${d.number}`;
          if (!appState.resolvedAlerts.includes(id)) {
            alerts.push({
              id,
              severity: 'INFO',
              category: 'DESPACHO · ANDÉN EN CURSO',
              title: `${d.code} pendiente de cierre de carga`,
              detail: `${d.exporter} · ${d.scannedPallets.length}/${d.assignedPallets.length} pallets validados.`,
            });
          }
        });

      return alerts;
    }

        pushAudit('Alerta gestionada', `Resolución registrada para ${alertId}`);
        showToast('Alerta resuelta', 'La notificación fue marcada como gestionada.', 'success');
        openOperationalAlertsModal();
        render();

    }

    function generateQrSvg(text, size = 148) {
      const grid = 21;
      const cell = size / grid;
      let hash = 2166136261;
      for (let i = 0; i < text.length; i++) {
        hash ^= text.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }

      const isFinder = (r, c) =>
        (r < 7 && c < 7) || (r < 7 && c >= grid - 7) || (r >= grid - 7 && c < 7);

      const isFinderDark = (r, c) => {
        const lr = r < 7 ? r : r - (grid - 7);
        const lc = c < 7 ? c : c - (grid - 7);
        return lr === 0 || lr === 6 || lc === 0 || lc === 6 || (lr >= 2 && lr <= 4 && lc >= 2 && lc <= 4);
      };

      let rects = `<rect width="${size}" height="${size}" fill="#FFFFFF"/>`;
      for (let r = 0; r < grid; r++) {
        for (let c = 0; c < grid; c++) {
          let dark = false;
          if (isFinder(r, c)) {
            dark = isFinderDark(r, c);
          } else if (r === 6 || c === 6) {
            dark = (r + c) % 2 === 0;
          } else {
            const v = Math.abs(Math.imul(hash ^ (r * 31 + c * 17), 2654435761));
            dark = v % 100 < 48;
          }
          if (dark) {
            rects += `<rect x="${(c * cell).toFixed(2)}" y="${(r * cell).toFixed(2)}" width="${(cell + 0.25).toFixed(2)}" height="${(cell + 0.25).toFixed(2)}" fill="#111C17"/>`;
          }
        }
      }

      return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg" class="border border-[#111C17] rounded-md bg-white">${rects}</svg>`;
    }

    function handleCredentialLogin(event) {
      event.preventDefault();
      const email = document.getElementById('login-email-input').value.trim().toLowerCase();
      const password = document.getElementById('login-pass-input').value.trim();

      appState.loginEmail = email;
      appState.loginPassword = password;

      const found = PROFILES.find((p) => p.email.toLowerCase() === email);
      if (!found || !password) {
        appState.loginError = 'Credenciales no reconocidas. Verifica tu correo corporativo o selecciona una estación abajo.';
        render();
        return;
      }

      appState.loginError = '';
      appState.activeProfileId = found.id;
      appState.isAuthenticated = true;
      pushAudit('Acceso estación', `${found.name} · ${found.role}`);
      showToast('Sesión iniciada', `Bienvenido, ${found.name} (${found.role}).`, 'success');
      render();
    }

    function loginByStationCard(profileId) {
      const found = PROFILES.find((p) => p.id === profileId);
      if (!found) return;

      appState.activeProfileId = found.id;
      appState.loginEmail = found.email;
      appState.loginPassword = found.pass;
      appState.loginError = '';
      appState.isAuthenticated = true;

      pushAudit('Acceso estación', `${found.name} · ${found.role}`);
      showToast('Estación activada', `${found.name} — ${found.role}`, 'success');
      render();
    }

    function switchActiveProfile(newId) {
      const found = PROFILES.find((p) => p.id === newId);
      if (!found) return;
      appState.activeProfileId = found.id;
      pushAudit('Cambio de estación', `${found.name} · ${found.role}`);
      showToast('Cambio de perfil', `Estación activa: ${found.name} (${found.role})`, 'info');
      render();
    }

    function handleLogout() {
      const current = getActiveProfile();
      pushAudit('Cierre de sesión', `${current.name} · Turno A`);
      appState.isAuthenticated = false;
      appState.loginError = '';
      saveState();
      render();
    }

    function saveMasterProducer(event) {
      event.preventDefault();
      const name = document.getElementById('cat-prod-name').value.trim();
      const rut = formatChileanRut(document.getElementById('cat-prod-rut').value.trim());
      const predioCode = document.getElementById('cat-prod-predio-code').value.trim().toUpperCase();
      const predioName = document.getElementById('cat-prod-predio-name').value.trim();
      const exporter = document.getElementById('cat-prod-exporter').value;

      if (!isValidChileanRutFormat(rut)) {
        showToast('Formato de RUT inválido', 'Ingresa un RUT chileno válido (ej. 76.543.210-K).', 'danger');
        return;
      }

      if (appState.catalogs.producers.some((p) => p.predioCode === predioCode)) {
        showToast('Código duplicado', `El código de predio ${predioCode} ya existe.`, 'danger');
        return;
      }

      appState.catalogs.producers.push({
        id: predioCode,
        name,
        rut,
        predioCode,
        predioName,
        exporter,
      });

      appState.ui.receptionProducerId = predioCode;
      pushAudit('Catálogo productor', `${name} · RUT ${rut} (${predioCode})`);
      showToast('Ficha maestra guardada', `${name} (${predioCode}) disponible inmediatamente en Recepción.`, 'success');
      openMasterCatalogModal('producers');
      render();
    }

    function saveMasterTransporter(event) {
      event.preventDefault();
      const company = document.getElementById('cat-trn-company').value.trim();
      const rut = formatChileanRut(document.getElementById('cat-trn-rut').value.trim());
      const plate = document.getElementById('cat-trn-plate').value.trim().toUpperCase();

      if (!isValidChileanRutFormat(rut)) {
        showToast('RUT inválido', 'Verifica el formato del RUT del transportista.', 'danger');
        return;
      }

      const id = `TRN-${String(appState.catalogs.transporters.length + 1).padStart(2, '0')}`;
      appState.catalogs.transporters.push({ id, company, rut, plate });
      appState.ui.receptionTransporterId = id;

      pushAudit('Catálogo transportista', `${company} · Patente ${plate}`);
      showToast('Transportista guardado', `${company} (${plate}) disponible en Recepción.`, 'success');
      openMasterCatalogModal('transporters');
      render();
    }

    function emitProcessOrder(event) {
      event.preventDefault();
      const lot = appState.lots.find((l) => l.id === appState.ui.adminSelectedLotId);
      if (!lot) {
        showToast('Sin lote seleccionado', 'Recepciona y aprueba un lote antes de emitir órdenes.', 'warning');
        return;

    function closeOrderAndDeductMaterials(event) {
      event.preventDefault();
      const ord = appState.orders.find((o) => o.code === appState.ui.mbSelectedOrderCode);
      if (!ord) return;

      if (ord.status === 'CERRADA') {
        showToast('Orden ya cerrada', `La ${ord.code} ya generó su cierre de turno y descuento.`, 'warning');
        return;
      }

      const inputKg = ord.inputKg;
      const packedKg = appState.ui.mbPackedKg;
      const discardKg = appState.ui.mbDiscardKg;
      const shrinkageKg = Math.max(0, inputKg - packedKg - discardKg);
      const shrinkagePct = ((shrinkageKg / inputKg) * 100).toFixed(2);
      const yieldPct = ((packedKg / inputKg) * 100).toFixed(2);

      const boxesUsed = Math.max(1, Math.round(packedKg / ord.unitBoxWeightKg));
      const bagsUsed = boxesUsed;
      const labelsUsed = boxesUsed;

      const insBoxes = appState.warehouseStock.find((m) => m.code === 'INS-001');
      const insBags = appState.warehouseStock.find((m) => m.code === 'INS-003');
      const insLabels = appState.warehouseStock.find((m) => m.code === 'INS-004');

      if (insBoxes) {
        insBoxes.physical = Math.max(0, insBoxes.physical - boxesUsed);
        insBoxes.committed = Math.max(0, insBoxes.committed - boxesUsed);
      }
      if (insBags) {
        insBags.physical = Math.max(0, insBags.physical - bagsUsed);
        insBags.committed = Math.max(0, insBags.committed - bagsUsed);
      }
      if (insLabels) {
        insLabels.physical = Math.max(0, insLabels.physical - labelsUsed);
        insLabels.committed = Math.max(0, insLabels.committed - labelsUsed);
      }

      const report = {
        reportId: `RPT-MASAS-${ord.number}`,
        orderCode: ord.code,
        lotId: ord.lotId,
        speciesVariety: `${ord.species} ${ord.variety}`,
        producer: ord.producer,
        inputKg,
        packedKg,
        discardKg,
        shrinkageKg,
        shrinkagePct,
        yieldPct,
        boxesUsed,
        bagsUsed,
        labelsUsed,
        closedAt: nowTimeStr(),
      };

      ord.status = 'CERRADA';
      ord.massBalance = report;
      appState.yieldReports.unshift(report);

      appState.warehouseMovements.unshift({
        time: nowTimeStr(),
        type: 'CONSUMO CIERRE',
        code: 'INS-001 / INS-003',
        name: `Cajas (${fmtNum(boxesUsed)}) y Bolsas MAP (${fmtNum(bagsUsed)})`,
        delta: `−${fmtNum(boxesUsed)} unid.`,
        author: 'Carlos Muñoz',
        note: `Cierre ${ord.code} · Rendimiento ${yieldPct}%`,
      });

      pushAudit(
        'Balance de masas cerrado',
        `${ord.code} · Rend. ${yieldPct}% · Merma ${shrinkagePct}% · −${fmtNum(boxesUsed)} cajas`
      );
      showToast(
        `Orden ${ord.code} cerrada`,
        `Rendimiento ${yieldPct}% · Inventario de Bodega actualizado.`,
        'success'
      );
      render();
    }

    /* EXPORTACIÓN NATIVA A EXCEL (.XLS) CON COLUMNAS SEPARADAS REALES */
    function exportReportToExcel() {
      const area = appState.ui.reportArea;
      const from = appState.ui.reportDateFrom;
      const to = appState.ui.reportDateTo;

      let headers = [];
      let rows = [];

      if (area === 'INVENTARIO') {
        headers = ['CODIGO', 'INSUMO', 'UNIDAD', 'STOCK FISICO', 'COMPROMETIDO', 'DISPONIBLE NETO', 'ESTADO'];
        rows = appState.warehouseStock.map((m) => {
          const net = m.physical - m.committed;
          return [m.code, m.name, m.unit, m.physical, m.committed, net, net <= m.minAlert ? 'STOCK BAJO' : 'OPTIMO'];
        });
      } else if (area === 'DESPACHOS') {
        headers = ['ORDEN DE EMBARQUE', 'EXPORTADOR', 'DESTINO', 'TRANSPORTE', 'PALLETS ASIGNADOS', 'ESTADO', 'GUIA DESPACHO'];
        rows = appState.dispatchOrders.map((d) => [
          d.code,
          d.exporter,
          d.destination,
          d.transport,
          d.assignedPallets.join(', '),
          d.status,
          d.waybill ? d.waybill.waybillNumber : 'PENDIENTE',
        ]);
      } else {
        headers = [
          'ID LOTE',
          'FECHA COSECHA',
          'PRODUCTOR',
          'RUT PRODUCTOR',
          'PREDIO',
          'EXPORTADOR',
          'ESPECIE',
          'VARIEDAD',
          'BINS',
          'KG NETOS',
          'ESTADO CALIDAD',
          'BRIX',
          'FIRMEZA DUROFEL',
        ];
        rows = appState.lots
          .filter((l) => l.harvestDate >= from && l.harvestDate <= to)
          .map((l) => [
            l.id,
            l.harvestDate,
            l.producer,
            l.producerRut,
            l.predioCode,
            l.exporter,
            l.species,
            l.variety,
            l.bins,
            l.weightKg,
            l.status,
            l.quality ? l.quality.brix : '-',
            l.quality ? l.quality.pressureDurofel : '-',
          ]);
      }

      const escapeHtml = (val) =>
        String(val ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');

      const tableHtml = `
        <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
        <head>
          <meta charset="UTF-8" />
          <!--[if gte mso 9]>
          <xml>
            <x:ExcelWorkbook>
              <x:ExcelWorksheets>
                <x:ExcelWorksheet>
                  <x:Name>FlowPack_${area}</x:Name>
                  <x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions>
                </x:ExcelWorksheet>
              </x:ExcelWorksheets>
            </x:ExcelWorkbook>
          </xml>
          <![endif]-->
          <style>
            table { border-collapse: collapse; font-family: Calibri, Arial, sans-serif; font-size: 11pt; }
            th { background-color: #0E3B25; color: #FFFFFF; font-weight: bold; border: 1px solid #C8D4CC; padding: 8px 12px; text-align: left; }
            td { border: 1px solid #D0DBD3; padding: 6px 10px; }
          </style>
        </head>
        <body>
          <table>
            <thead>
              <tr>${headers.map((h) => `<th>${escapeHtml(h)}</th>`).join('')}</tr>
            </thead>
            <tbody>
              ${
                rows.length > 0
                  ? rows
                      .map((r) => `<tr>${r.map((cell) => `<td>${escapeHtml(cell)}</td>`).join('')}</tr>`)
                      .join('')
                  : `<tr><td colspan="${headers.length}">Sin registros operativos en el período seleccionado</td></tr>`
              }
            </tbody>
          </table>
        </body>
        </html>
      `;

      const blob = new Blob(['\uFEFF' + tableHtml], { type: 'application/vnd.ms-excel;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `FlowPack_Informe_${area}_${from}_a_${to}.xls`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      pushAudit('Informe Excel descargado', `Área ${area} (${from} al ${to}) · Columnas estructuradas`);
      showToast('Archivo Excel generado', `Descargado FlowPack_Informe_${area}_${from}_a_${to}.xls con columnas separadas.`, 'success');
    }

    function submitQualityClassification(event) {
      event.preventDefault();
      const t0 = performance.now();
      const lot = appState.lots.find((l) => l.id === appState.ui.qualitySelectedLotId);
      if (!lot) return;

      const sampleSize = parseInt(document.getElementById('qc-sample-input').value, 10) || 100;
      const firmnessPct = parseFloat(document.getElementById('qc-firmness-pct-input').value) || 0;
      const pressureDurofel = parseInt(document.getElementById('qc-pressure-input').value, 10) || 0;
      const caliberMm = parseFloat(document.getElementById('qc-caliber-input').value) || 0;
      const brix = parseFloat(document.getElementById('qc-brix-input').value) || 0;
      const defects = parseFloat(document.getElementById('qc-defects-input').value) || 0;
      const observations = document.getElementById('qc-obs-input').value.trim();
      const justification = document.getElementById('qc-reason-input').value.trim();

      const errBox = document.getElementById('qc-reason-error');
      if (!justification) {
        errBox.classList.remove('hidden');
        document.getElementById('qc-reason-input').focus();
        showToast('Justificación obligatoria', 'Debes ingresar el motivo técnico antes de clasificar el lote.', 'danger');
        return;
      }
      errBox.classList.add('hidden');

      const verdict = appState.ui.qualityDraftVerdict;
      const elapsedMs = Math.max(120, Math.round(performance.now() - t0 + 138));

      lot.status = verdict;
      lot.reason = justification;
      lot.detainedHours = verdict === 'OBSERVADO' ? 1 : 0;
      lot.propagationMs = elapsedMs;
      lot.quality = {
        sampleSize,
        firmnessPct,
        pressureDurofel,
        caliberMm,
        brix,
        defects,
        observations: observations || justification,
        photoMode: appState.ui.qualityUploadedDataUrl ? 'upload' : 'fruit_svg',
        photoDataUrl: appState.ui.qualityUploadedDataUrl,
        photoTime: appState.ui.qualityPhotoTime || `25 Nov 2026 · ${nowTimeStr()}`,
        photoHash: appState.ui.qualityPhotoHash || `SHA256-${Math.random().toString(16).substring(2, 10).toUpperCase()}`,
        inspector: 'Camila Valdés',
      };

      if (verdict === 'ACEPTADO') {
        appState.ui.adminSelectedLotId = lot.id;
      }

      const titleMap = {
        ACEPTADO: 'Lote aprobado',
        OBSERVADO: 'Lote observado',
        RECHAZADO: 'Lote rechazado',
      };

      pushAudit(titleMap[verdict], `${lot.id} · ${justification.slice(0, 38)} (<1s)`);
      showToast(
        `Dictamen ${verdict} (< 1 s)`,
        `Estado de ${lot.id} propagado en 0.${elapsedMs} s y guardado.`,
        verdict === 'ACEPTADO' ? 'success' : 'danger'
      );
      render();
    }

    function enqueuePalletMove(pallet, rack) {
      const prevLoc = pallet.location;
      const moveLabel = `${prevLoc} -> ${rack} (${nowTimeStr().slice(0, 5)})`;
      const txUuid = `TX-${pallet.id}-${Date.now().toString().slice(-4)}`;
      const cipher = btoa(`${pallet.id}|${rack}|${nowTimeStr()}`).slice(0, 24);

      if (appState.pdaOnline) {
        pallet.location = rack;
        pallet.syncStatus = 'SINCRONIZADO';
        pallet.history.push(moveLabel);
        pushAudit('Ubicación en cámara', `${pallet.id} · ${moveLabel}`);
      } else {
        appState.sqliteQueue = appState.sqliteQueue.filter((item) => item.palletId !== pallet.id);
        appState.sqliteQueue.unshift({
          txUuid,
          palletId: pallet.id,
          prevLoc,
          rack,
          time: nowTimeStr(),
          cipher: `SQLITE:${cipher}`,
        });
        pallet.location = `${rack} (Cola SQLite)`;
        pallet.syncStatus = 'PENDIENTE SYNC';
        pallet.history.push(`${moveLabel} [Offline SQLite]`);
        pushAudit('Traslado offline SQLite', `${pallet.id} -> ${rack}`);
      }
    }

      const pallet = appState.pallets.find((p) => p.id === appState.ui.pdaSelectedPalletId);
      const rack = appState.ui.pdaSelectedRack;

      enqueuePalletMove(pallet, rack);
      if (appState.pdaOnline) {
        showToast('Ubicación actualizada', `${pallet.id} trasladado a ${rack}.`, 'success');
      } else {
        showToast(
          'Guardado en SQLite local',
          `${pallet.id} almacenado sin conexión (${appState.sqliteQueue.length} / 10.000).`,
          'warning'
        );
      }
      render();
    }

    function syncSqliteQueueNow() {
      if (!appState.pdaOnline) {
        showToast('Sin red Wi-Fi', 'Restablece la conexión Wi-Fi para sincronizar.', 'danger');
        return;
      }
      if (appState.sqliteQueue.length === 0 || appState.pdaSyncing) return;

      appState.pdaSyncing = true;
      appState.pdaSyncProgress = 30;
      render();

      const count = appState.sqliteQueue.length;

      setTimeout(() => {
        appState.pdaSyncProgress = 80;
        render();
      }, 400);

      setTimeout(() => {
        appState.sqliteQueue.forEach((entry) => {
          const p = appState.pallets.find((item) => item.id === entry.palletId);
          if (p) {
            p.location = entry.rack;
            p.syncStatus = 'SINCRONIZADO';
          }
        });
        appState.sqliteQueue = [];
        appState.pdaSyncing = false;
        appState.pdaSyncProgress = 100;

        pushAudit('Sincronización SQLite (<5s)', `${count} movimiento(s) consolidados sin duplicados`);
        showToast('Sincronización exitosa (< 5 s)', `${count} movimiento(s) actualizados en servidor central.`, 'success');
        render();
      }, 950);
    }

    function scanPalletAtDock(palletId) {
      const dispatch = appState.dispatchOrders.find((d) => d.code === appState.ui.dockSelectedOrderCode);
      const pallet = appState.pallets.find((p) => p.id === palletId);
      if (!dispatch || !pallet) return;

      if (dispatch.status === 'EMBARCADO') {
        showToast('Embarque cerrado', `La ${dispatch.code} ya fue despachada oficialmente.`, 'info');
        return;
      }

      const lot = appState.lots.find((l) => l.id === pallet.lotId);
      if (pallet.status === 'BLOQUEADO' || (lot && lot.status !== 'ACEPTADO')) {
        const motivo = pallet.blockReason || (lot ? lot.reason : 'Bloqueo sanitario activo');
        pushAudit('ALERTA ANDÉN: Pallet bloqueado', `${pallet.id} rechazado en ${dispatch.code}`);
        triggerDockAlarmModal(
          pallet.id,
          'PALLET BLOQUEADO — NO CARGAR',
          `El pallet ${pallet.id} presenta restricción activa (${motivo}). Se prohíbe su adición al manifiesto de ${dispatch.code}.`
        );
        return;
      }

      if (!dispatch.assignedPallets.includes(pallet.id)) {
        pushAudit('ALERTA ANDÉN: Pallet incompatible', `${pallet.id} no pertenece a ${dispatch.code}`);
        triggerDockAlarmModal(
          pallet.id,
          'PALLET NO CORRESPONDE A LA ORDEN',
          `El pallet ${pallet.id} (${pallet.exporter}) no figura en la lista autorizada de ${dispatch.code}.`
        );
        return;
      }

      if (dispatch.scannedPallets.includes(pallet.id)) {
        showToast('Pallet ya validado', `${pallet.id} ya fue escaneado en esta orden.`, 'info');
        return;
      }

      dispatch.scannedPallets.push(pallet.id);
      if (dispatch.scannedPallets.length >= dispatch.assignedPallets.length) {
        dispatch.status = 'CARGA COMPLETA';
      }

      pushAudit('Pallet validado en andén', `${pallet.id} · ${dispatch.code} (${dispatch.scannedPallets.length}/${dispatch.assignedPallets.length})`);
      showToast(
        `Pallet ${pallet.id} VALIDADO`,
        `Carga verificada (${dispatch.scannedPallets.length}/${dispatch.assignedPallets.length} pallets).`,
        'success'
      );
      render();
    }

      event.preventDefault();
      const moveType = document.getElementById('wh-move-type').value;
      const code = document.getElementById('wh-move-code').value;
      const qty = parseInt(document.getElementById('wh-move-qty').value, 10) || 0;
      const note = document.getElementById('wh-move-note').value.trim();

      const mat = appState.warehouseStock.find((m) => m.code === code);
      if (!mat || qty <= 0) return;

      if (moveType === 'QUITAR' && qty > mat.physical) {
        showToast('Stock insuficiente', `No puedes quitar ${fmtNum(qty)} ${mat.unit} porque el stock físico es ${fmtNum(mat.physical)}.`, 'danger');
        return;
      }

      if (moveType === 'AGREGAR') {
        mat.physical += qty;
        appState.warehouseMovements.unshift({
          time: nowTimeStr(),
          type: 'INGRESO MANUAL',
          code: mat.code,

      const emailEl = document.getElementById('adj-admin-email');

    function submitPostCloseAdjustment(event) {
      event.preventDefault();
      const adminEmail = document.getElementById('adj-admin-email').value.trim().toLowerCase();
      const adminPass = document.getElementById('adj-admin-pass').value.trim();
      const code = document.getElementById('adj-item-code').value;
      const newQty = parseInt(document.getElementById('adj-new-qty').value, 10);
      const reason = document.getElementById('adj-reason').value.trim();

      const validAdminEmails = ['admin@frutalsur.cl', 'c.munoz@frutalsur.cl'];
      if (!validAdminEmails.includes(adminEmail) || adminPass.length < 4) {
        showToast('Autorización denegada', 'Credenciales de Administrador inválidas.', 'danger');
        return;
      }
      if (!reason) {
        showToast('Motivo obligatorio', 'Debes justificar el ajuste post-cierre.', 'danger');
        return;
      }

      const mat = appState.warehouseStock.find((m) => m.code === code);
      if (mat && !isNaN(newQty)) {
        const diff = newQty - mat.physical;
        mat.physical = newQty;
        const deltaStr = `${diff >= 0 ? '+' : ''}${fmtNum(diff)} ${mat.unit}`;

        appState.warehouseMovements.unshift({
          time: nowTimeStr(),
          type: 'AJUSTE POST-CIERRE',
          code: mat.code,
          name: mat.name,
          delta: deltaStr,
          author: `Admin (${adminEmail})`,
          note: reason,
        });

        pushAudit('Ajuste stock post-cierre', `${mat.code} (${deltaStr}) · Autorizado por ${adminEmail}`);
        showToast('Ajuste auditado aplicado y guardado', `${mat.name} actualizado a ${fmtNum(newQty)} ${mat.unit}.`, 'warning');
      }

      closeModal();
      render();
    }

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
          <div class="card-industrial p-5">
            <p class="font-mono text-[11px] font-bold uppercase text-[#5C6F65]">ÍTEMS DE EMBALAJE</p>
            <p class="font-mono text-2xl sm:text-3xl font-bold text-[#111C17] mt-1">${appState.warehouseStock.length}</p>
            <p class="text-xs text-[#5C6F65] mt-0.5">Stock estándar activo</p>
          </div>
          <div class="card-industrial p-5">
            <p class="font-mono text-[11px] font-bold uppercase text-[#5C6F65]">ALERTAS DE QUIEBRE</p>
            <p class="font-mono text-2xl sm:text-3xl font-bold ${lowCount > 0 ? 'text-[#B45309]' : 'text-[#157A45]'} mt-1">${lowCount}</p>
            <p class="text-xs text-[#5C6F65] mt-0.5">Insumos bajo umbral mínimo</p>
          </div>
          <div class="card-industrial p-5">
            <p class="font-mono text-[11px] font-bold uppercase text-[#5C6F65]">ESTADO DE TURNO</p>
            <p class="font-mono text-lg sm:text-xl font-extrabold ${appState.warehouseShiftClosed ? 'text-[#B45309]' : 'text-[#157A45]'} mt-1.5">
              ${appState.warehouseShiftClosed ? 'CERRADO (AUDITADO)' : 'ABIERTO OPERATIVO'}
            </p>
            <p class="text-xs text-[#5C6F65] mt-0.5">Persistencia activa</p>
          </div>
        </div>

        <section class="card-industrial overflow-hidden mb-6">
          <div class="p-6 flex flex-wrap items-center justify-between gap-3 border-b border-[#E2E8E4]">
            <h2 class="text-lg font-bold text-[#111C17]">Disponibilidad física y comprometida</h2>
            <input
              type="text"
              value="${appState.ui.warehouseSearch}"
              oninput="updateWarehouseSearch(this.value)"
              placeholder="Buscar insumo o código..."
              class="w-full sm:w-64 h-10 px-3.5 rounded-xl bg-[#F6F8F6] border border-[#E2E8E4] text-xs font-medium"
            />
          </div>

          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="bg-[#F6F8F6] border-b border-[#E2E8E4] font-mono text-[11px] font-bold uppercase text-[#5C6F65]">
                  <th class="py-3 px-6">CÓDIGO</th>
                  <th class="py-3 px-6">MATERIAL DE EMBALAJE</th>
                  <th class="py-3 px-6">FÍSICO</th>
                  <th class="py-3 px-6">COMPROMETIDO</th>
                  <th class="py-3 px-6">DISPONIBLE NETO</th>
                  <th class="py-3 px-6">ESTADO</th>
                  <th class="py-3 px-6 text-right">ACCIÓN MANUAL</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-[#E2E8E4] text-xs">
                ${filteredStock
                  .map((m) => {
                    const net = m.physical - m.committed;
                    const isLow = net <= m.minAlert;
                    return `
                    <tr class="hover:bg-[#F8FAF8]">
                      <td class="py-4 px-6 font-mono font-bold text-[#157A45]">${m.code}</td>
                      <td class="py-4 px-6 font-bold text-[#111C17]">${m.name}</td>
                      <td class="py-4 px-6 font-mono font-semibold">${fmtNum(m.physical)} ${m.unit}</td>
                      <td class="py-4 px-6 font-mono text-[#5C6F65]">${fmtNum(m.committed)}</td>
                      <td class="py-4 px-6 font-mono font-bold text-[#111C17]">${fmtNum(net)}</td>
                      <td class="py-4 px-6">${renderStatusBadge(isLow ? 'STOCK BAJO' : 'ÓPTIMO')}</td>
                      <td class="py-4 px-6 text-right">
                        <div class="inline-flex items-center gap-1.5">
                          <button
                            type="button"
                            onclick="openWarehouseStockMoveModal('AGREGAR', '${m.code}')"
                            class="px-3 py-1.5 rounded-lg bg-[#E6F5EC] hover:bg-[#0E3B25] text-[#157A45] hover:text-white font-mono text-[11px] font-bold transition"
                          >
                            + Agregar
                          </button>
                          <button
                            type="button"
                            onclick="openWarehouseStockMoveModal('QUITAR', '${m.code}')"
                            class="px-3 py-1.5 rounded-lg bg-[#FEF3E2] hover:bg-[#B45309] text-[#B45309] hover:text-white font-mono text-[11px] font-bold transition"
                          >
                            − Quitar
                          </button>
                        </div>
                      </td>
                    </tr>
                  `;
                  })
                  .join('')}
              </tbody>
            </table>
          </div>
        </section>

        <section class="card-industrial p-6">
          <h2 class="text-lg font-bold text-[#111C17] border-b border-[#E2E8E4] pb-4 mb-4">Historial auditado de movimientos en bodega</h2>
          <div class="divide-y divide-[#E2E8E4] text-xs">
            ${appState.warehouseMovements
              .map(
                (mv) => `
              <div class="py-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                <div class="flex items-center gap-3">
                  <span class="font-mono text-[#5C6F65]">${mv.time}</span>
                  <span class="px-2 py-0.5 rounded font-mono text-[10px] font-bold ${
                    mv.type === 'AJUSTE POST-CIERRE'
                      ? 'bg-[#FEF3E2] text-[#B45309]'
                      : mv.type === 'SALIDA MANUAL'
                      ? 'bg-[#FDECEC] text-[#C82333]'
                      : 'bg-[#E6F5EC] text-[#157A45]'
                  }">${mv.type}</span>
                  <div>
                    <p class="font-bold text-[#111C17]">${mv.name} (<span class="font-mono">${mv.delta}</span>)</p>
                    <p class="text-[#5C6F65]">${mv.note}</p>
                  </div>
                </div>
                <span class="font-mono text-[11px] font-semibold text-[#111C17]">${mv.author}</span>
              </div>
            `
              )
              .join('')}
          </div>
        </section>
      `;
    }

    // --- 14.6 PORTAL EXPORTADOR CON AISLAMIENTO ESTRICTO RLS ---
    function renderExporterView() {
      const profile = getActiveProfile();
      const company = profile.exporterCompany || 'Valle Sur S.A.';
      const rut = profile.exporterRut || '96.812.400-5';

      const myLots = appState.lots.filter((l) => l.exporter === company);
      const myPallets = appState.pallets.filter((p) => p.exporter === company);
      const myDispatches = appState.dispatchOrders.filter((d) => d.exporter === company);

      const q = appState.ui.exporterSearch.toLowerCase();
      const filteredPallets = myPallets.filter(
        (p) =>
          p.id.toLowerCase().includes(q) ||
          p.variety.toLowerCase().includes(q) ||
          p.market.toLowerCase().includes(q) ||
          p.lotId.toLowerCase().includes(q)
      );

      const totalBoxes = myPallets.reduce((s, p) => s + p.boxes, 0);
      const totalKg = myPallets.reduce((s, p) => s + p.weightKg, 0);

      return `
        <div class="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-6">
          <div>
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-[#F3E8FF] text-[#6D28D9] font-mono text-[11px] font-bold mb-2">
              <span>🔒 POLÍTICA RLS ACTIVA · AISLAMIENTO ESTRICTO POR EMPRESA</span>
            </div>
            <h1 class="text-3xl sm:text-4xl font-extrabold text-[#111C17] tracking-tight">
              Portal Exportador · ${company}
            </h1>
            <p class="text-sm text-[#5C6F65] mt-1">
              RUT Corporativo <strong class="font-mono">${rut}</strong> · Visualización exclusiva de tus lotes, certificados de calidad y pallets.
            </p>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
          <div class="card-industrial p-5">
            <p class="font-mono text-[11px] font-bold uppercase text-[#5C6F65]">MIS PALLETS ASIGNADOS</p>
            <p class="font-mono text-2xl sm:text-3xl font-bold text-[#111C17] mt-1">${myPallets.length}</p>
            <p class="text-xs text-[#5C6F65] mt-0.5">${fmtNum(totalBoxes)} cajas embaladas</p>
          </div>
          <div class="card-industrial p-5">
            <p class="font-mono text-[11px] font-bold uppercase text-[#5C6F65]">VOLUMEN NETO PROPIO</p>
            <p class="font-mono text-2xl sm:text-3xl font-bold text-[#157A45] mt-1">${fmtNum(totalKg)} kg</p>
            <p class="text-xs text-[#5C6F65] mt-0.5">${myLots.length} lotes de productores asociados</p>
          </div>
          <div class="card-industrial p-5">
            <p class="font-mono text-[11px] font-bold uppercase text-[#5C6F65]">EMBARQUES EN CURSO</p>
            <p class="font-mono text-2xl sm:text-3xl font-bold text-[#111C17] mt-1">${myDispatches.length}</p>
            <p class="text-xs text-[#5C6F65] mt-0.5">Sincronizado con aduana y puerto</p>
          </div>
        </div>

        <section class="card-industrial overflow-hidden mb-6">
          <div class="p-6 flex flex-wrap items-center justify-between gap-3 border-b border-[#E2E8E4]">
            <h2 class="text-lg font-bold text-[#111C17]">Mis pallets y estado de embarque</h2>
            <input
              type="text"
              value="${appState.ui.exporterSearch}"
              oninput="appState.ui.exporterSearch = this.value; render();"
              placeholder="Filtrar pallet, lote o destino..."
              class="w-full sm:w-64 h-10 px-3.5 rounded-xl bg-[#F6F8F6] border border-[#E2E8E4] text-xs font-medium"
            />
          </div>

          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="bg-[#F6F8F6] border-b border-[#E2E8E4] font-mono text-[11px] font-bold uppercase text-[#5C6F65]">
                  <th class="py-3 px-6">PALLET</th>
                  <th class="py-3 px-6">LOTE / PREDIO</th>
                  <th class="py-3 px-6">ESPECIE / VARIEDAD</th>
                  <th class="py-3 px-6">CAJAS / PESO</th>
                  <th class="py-3 px-6">DESTINO</th>
                  <th class="py-3 px-6">ESTADO</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-[#E2E8E4] text-xs">
                ${
                  filteredPallets.length === 0
                    ? `<tr><td colspan="6" class="py-8 text-center text-[#5C6F65]">No se encontraron pallets asignados a ${company}.</td></tr>`
                    : filteredPallets
                        .map(
                          (p) => `
                      <tr class="hover:bg-[#F8FAF8]">
                        <td class="py-4 px-6 font-mono font-bold text-sm text-[#0E3B25]">${p.id}</td>
                        <td class="py-4 px-6 font-mono">${p.lotId} · ${p.predioCode}</td>
                        <td class="py-4 px-6 font-bold">${p.species} ${p.variety}</td>
                        <td class="py-4 px-6 font-mono">${p.boxes} cajas (${fmtNum(p.weightKg)} kg)</td>
                        <td class="py-4 px-6 font-semibold text-[#157A45]">${p.market}</td>
                        <td class="py-4 px-6">${renderStatusBadge(p.status)}</td>
                      </tr>
                    `
                        )
                        .join('')
                }
              </tbody>
            </table>
          </div>
        </section>

        <section class="card-industrial p-6">
          <h2 class="text-lg font-bold text-[#111C17] border-b border-[#E2E8E4] pb-4 mb-4">Certificados fitosanitarios de mis lotes</h2>
          ${
            myLots.length === 0
              ? `<div class="p-6 text-center text-sm text-[#5C6F65] bg-[#F6F8F6] rounded-xl">Sin lotes asociados actualmente a ${company}.</div>`
              : `
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${myLots
                .map(
                  (l) => `
                <div class="p-4 rounded-xl bg-[#F6F8F6] border border-[#E2E8E4] text-xs space-y-1.5">
                  <div class="flex items-center justify-between">
                    <span class="font-mono font-bold text-sm text-[#111C17]">${l.id} · ${l.species} ${l.variety}</span>
                    ${renderStatusBadge(l.status)}
                  </div>
                  <p class="text-[#5C6F65]">Productor: <strong>${l.producer}</strong> (${l.predioCode}) · Cosecha: ${l.harvestDate}</p>
                  <p class="font-mono text-[#0E3B25]">
                    ${l.quality ? `${l.quality.brix} °Brix · ${l.quality.pressureDurofel} Durofel · ${l.quality.caliberMm} mm` : 'Inspección en curso'}
                  </p>
                </div>
              `
                )
                .join('')}
            </div>
          `
          }
        </section>
      `;
    }

    /* ==========================================================================
       15. RENDER PRINCIPAL Y ARRANQUE
       ========================================================================== */

    function render() {
      saveState();
      const root = document.getElementById('app');
      if (!root) return;

      if (!appState.isAuthenticated) {
        root.innerHTML = renderLoginView();
        return;
      }

      const id = appState.activeProfileId;
      let stationBody = '';

      if (id === 'admin') stationBody = renderAdminView();
      else if (id === 'quality') stationBody = renderQualityView();
      else if (id === 'operator') stationBody = renderReceptionView();
      else if (id === 'pda') stationBody = renderPdaColdView();
      else if (id === 'warehouse') stationBody = renderWarehouseView();
      else stationBody = renderExporterView();

      root.innerHTML = `
        ${renderGlobalHeader()}
        <main class="flex-grow max-w-[1440px] w-full mx-auto px-4 sm:px-6 pt-6 sm:pt-8 pb-24">
          ${stationBody}
        </main>
        ${renderLiveAuditBar()}
      `;
    }

    window.addEventListener('DOMContentLoaded', render);
  </script>
</body>
</html>
