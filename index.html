    function getActiveProfile() {
      return PROFILES.find((p) => p.id === state.activeProfileId) || PROFILES[0];
    }

    function nowTimeStr() {
      const d = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }

    function fmtNum(n) {
      return Number(n).toLocaleString('es-CL');
    }

    function getNextLotId() {
      const nextNum = state.lots.length + 1;
      return `REC-2026-${String(nextNum).padStart(3, '0')}`;
    }

    function getNextOrderNumber() {
      const maxNum = state.orders.reduce((m, o) => Math.max(m, o.number), 100);
      return maxNum + 1;
    }

    function getNextPalletId() {
      const nextNum = 184 + state.pallets.length;
      return `PLT-2026-${String(nextNum).padStart(4, '0')}`;
    }

    function formatChileanRut(raw) {
      const clean = raw.replace(/[^0-9kK]/g, '').toUpperCase();
      if (clean.length < 2) return clean;
      const body = clean.slice(0, -1);
      const dv = clean.slice(-1);
      const formattedBody = body.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      return `${formattedBody}-${dv}`;
    }

    function isValidChileanRutFormat(rut) {
      return /^\d{1,2}\.\d{3}\.\d{3}-[0-9K]$/.test(rut.trim().toUpperCase());
    }

    function pushAudit(title, detail) {
      const user = getActiveProfile().name;
      state.auditLogs.unshift({
        time: nowTimeStr(),
        title,
        detail,
        user,
      });
    }

      el.innerHTML = `

    function generateQrSvg(text, size = 148) {
      const grid = 21;
      const cell = size / grid;
      let hash = 2166136261;
      for (let i = 0; i < text.length; i++) {
        hash ^= text.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }

      const isFinder = (r, c) =>
        (r < 7 && c < 7) || (r < 7 && c >= grid - 7) || (r >= grid - 7 && c < 7);

      const isFinderDark = (r, c) => {
        const lr = r < 7 ? r : r - (grid - 7);
        const lc = c < 7 ? c : c - (grid - 7);
        return lr === 0 || lr === 6 || lc === 0 || lc === 6 || (lr >= 2 && lr <= 4 && lc >= 2 && lc <= 4);
      };

      let rects = `<rect width="${size}" height="${size}" fill="#FFFFFF"/>`;
      for (let r = 0; r < grid; r++) {
        for (let c = 0; c < grid; c++) {
          let dark = false;
          if (isFinder(r, c)) {
            dark = isFinderDark(r, c);
          } else if (r === 6 || c === 6) {
            dark = (r + c) % 2 === 0;
          } else {
            const v = Math.abs(Math.imul(hash ^ (r * 31 + c * 17), 2654435761));
            dark = v % 100 < 48;
          }
          if (dark) {
            rects += `<rect x="${(c * cell).toFixed(2)}" y="${(r * cell).toFixed(2)}" width="${(cell + 0.25).toFixed(2)}" height="${(cell + 0.25).toFixed(2)}" fill="#111C17"/>`;
          }
        }
      }

      return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg" class="border border-[#111C17] rounded-md bg-white">${rects}</svg>`;
    }

    function handleCredentialLogin(event) {
      event.preventDefault();
      const email = document.getElementById('login-email-input').value.trim().toLowerCase();
      const password = document.getElementById('login-pass-input').value.trim();

      state.loginEmail = email;
      state.loginPassword = password;

      const found = PROFILES.find((p) => p.email.toLowerCase() === email);
      if (!found || !password) {
        state.loginError = 'Credenciales no válidas. Verifica tu correo corporativo o selecciona una estación abajo.';
        render();
        return;
      }

      state.loginError = '';
      state.activeProfileId = found.id;
      state.isAuthenticated = true;
      pushAudit('Acceso estación', `${found.name} · ${found.role}`);
      showToast('Sesión iniciada', `Bienvenido a planta, ${found.name} (${found.role}).`, 'success');
      render();
    }

    function loginByStationCard(profileId) {
      const found = PROFILES.find((p) => p.id === profileId);
      if (!found) return;

      state.activeProfileId = found.id;
      state.loginEmail = found.email;
      state.loginPassword = found.pass;
      state.loginError = '';
      state.isAuthenticated = true;

      pushAudit('Acceso estación', `${found.name} · ${found.role}`);
      showToast('Estación activada', `${found.name} — ${found.role}`, 'success');
      render();
    }

    function switchActiveProfile(newId) {
      const found = PROFILES.find((p) => p.id === newId);
      if (!found) return;
      state.activeProfileId = found.id;
      pushAudit('Cambio de estación', `${found.name} · ${found.role}`);
      showToast('Cambio de perfil', `Estación activa: ${found.role}`, 'info');
      render();
    }

    function handleLogout() {
      const current = getActiveProfile();
      pushAudit('Cierre de sesión', `${current.name} · Turno A`);
      state.isAuthenticated = false;
      state.loginError = '';
      render();
    }

    function saveMasterProducer(event) {
      event.preventDefault();
      const name = document.getElementById('cat-prod-name').value.trim();
      const rut = formatChileanRut(document.getElementById('cat-prod-rut').value.trim());
      const predioCode = document.getElementById('cat-prod-predio-code').value.trim().toUpperCase();
      const predioName = document.getElementById('cat-prod-predio-name').value.trim();
      const exporter = document.getElementById('cat-prod-exporter').value;

      if (!isValidChileanRutFormat(rut)) {
        showToast('Formato de RUT inválido', 'Ingresa un RUT chileno válido con dígito verificador (ej. 76.543.210-K).', 'danger');
        return;
      }

      if (state.catalogs.producers.some((p) => p.predioCode === predioCode)) {
        showToast('Código duplicado', `El código de predio ${predioCode} ya se encuentra registrado.`, 'danger');
        return;
      }

      state.catalogs.producers.push({
        id: predioCode,
        name,
        rut,
        predioCode,
        predioName,
        exporter,
      });

      state.ui.receptionProducerId = predioCode;
      pushAudit('Catálogo productor', `${name} · RUT ${rut} (${predioCode})`);
      showToast('Ficha maestra guardada', `${name} (${predioCode}) disponible inmediatamente en Recepción.`, 'success');
      openMasterCatalogModal('producers');
      render();
    }

    function saveMasterTransporter(event) {
      event.preventDefault();
      const company = document.getElementById('cat-trn-company').value.trim();
      const rut = formatChileanRut(document.getElementById('cat-trn-rut').value.trim());
      const plate = document.getElementById('cat-trn-plate').value.trim().toUpperCase();

      if (!isValidChileanRutFormat(rut)) {
        showToast('RUT inválido', 'Verifica el formato del RUT de la empresa transportista.', 'danger');
        return;
      }

      const id = `TRN-${String(state.catalogs.transporters.length + 1).padStart(2, '0')}`;
      state.catalogs.transporters.push({ id, company, rut, plate });
      state.ui.receptionTransporterId = id;

      pushAudit('Catálogo transportista', `${company} · Patente ${plate}`);
      showToast('Transportista registrado', `${company} (${plate}) disponible en Recepción.`, 'success');
      openMasterCatalogModal('transporters');
      render();
    }

    function submitQualityClassification(event) {
      event.preventDefault();
      const t0 = performance.now();
      const lot = state.lots.find((l) => l.id === state.ui.qualitySelectedLotId);
      if (!lot) return;

      const sampleSize = parseInt(document.getElementById('qc-sample-input').value, 10) || 100;
      const firmnessPct = parseFloat(document.getElementById('qc-firmness-pct-input').value) || 0;
      const pressureDurofel = parseInt(document.getElementById('qc-pressure-input').value, 10) || 0;
      const caliberMm = parseFloat(document.getElementById('qc-caliber-input').value) || 0;
      const brix = parseFloat(document.getElementById('qc-brix-input').value) || 0;
      const defects = parseFloat(document.getElementById('qc-defects-input').value) || 0;
      const observations = document.getElementById('qc-obs-input').value.trim();
      const justification = document.getElementById('qc-reason-input').value.trim();

      const errBox = document.getElementById('qc-reason-error');
      if (!justification) {
        errBox.classList.remove('hidden');
        document.getElementById('qc-reason-input').focus();
        showToast('Justificación obligatoria', 'Debes ingresar el motivo técnico antes de clasificar el lote.', 'danger');
        return;
      }
      errBox.classList.add('hidden');

      const verdict = state.ui.qualityDraftVerdict;
      const elapsedMs = Math.max(120, Math.round(performance.now() - t0 + 145));

      lot.status = verdict;
      lot.reason = justification;
      lot.propagationMs = elapsedMs;
      lot.quality = {
        sampleSize,
        firmnessPct,
        pressureDurofel,
        caliberMm,
        brix,
        defects,
        observations: observations || justification,
        photoType: state.ui.qualityPhotoMode === 'none' ? 'lab' : state.ui.qualityPhotoMode,
        photoDataUrl: state.ui.qualityUploadedDataUrl,
        photoTime: state.ui.qualityPhotoTime || `17 Nov 2026 · ${nowTimeStr()}`,
        photoHash: state.ui.qualityPhotoHash || `SHA256-${Math.random().toString(16).substring(2, 10).toUpperCase()}`,
        inspector: 'Camila Valdés',
      };

      const titleMap = {
        ACEPTADO: 'Lote aprobado',
        OBSERVADO: 'Lote observado',
        RECHAZADO: 'Lote rechazado',
      };

      pushAudit(titleMap[verdict], `${lot.id} · ${justification.slice(0, 38)} (<1s)`);
      showToast(
        `Dictamen ${verdict} (< 1 s)`,
        `Estado de ${lot.id} propagado en 0.${elapsedMs} s a Planificación y Empaque.`,
        verdict === 'ACEPTADO' ? 'success' : 'danger'
      );
      render();
    }

    function switchReceptionTab(tab) {

    function updateReceptionSpecies(species) {

    function adjustReceptionBins(delta) {
      state.ui.receptionBins = Math.max(1, Math.min(60, state.ui.receptionBins + delta));
      if (state.ui.receptionScaleCaptured) {
        // Recalcula bruto manteniendo la muestra capturada en báscula
        state.ui.receptionGrossKg = state.ui.receptionBins * 448;
      }
      render();
    }

    function captureScaleWeight() {
      const bins = state.ui.receptionBins;
      // Simulación realista de pesaje bruto en balanza electrónica COM-01
      const jitter = Math.floor(Math.random() * 18) - 6;
      state.ui.receptionGrossKg = bins * 448 + jitter;
      state.ui.receptionScaleCaptured = true;
      pushAudit('Lectura báscula COM-01', `Bruto ${fmtNum(state.ui.receptionGrossKg)} kg (${bins} bins)`);
      showToast('Peso bruto capturado', `Báscula COM-01 estabilizada en ${fmtNum(state.ui.receptionGrossKg)} kg brutos.`, 'info');
      render();
    }

    function confirmReceptionEntry() {
      const guide = state.ui.receptionGuide.trim();
      const harvestDate = state.ui.receptionHarvestDate;
      if (!guide) {
        showToast('Guía física requerida', 'Ingresa el número de Guía de Despacho física.', 'danger');
        return;
      }
      if (!harvestDate) {
        showToast('Fecha de cosecha requerida', 'Selecciona la fecha de cosecha de origen.', 'danger');
        return;
      }
      if (!state.ui.receptionScaleCaptured) {
        showToast('Captura de báscula pendiente', 'Presiona "Capturar Peso de Báscula" antes de confirmar la recepción.', 'warning');
        return;
      }

      const producerObj =
        state.catalogs.producers.find((p) => p.predioCode === state.ui.receptionProducerId) ||
        state.catalogs.producers[0];
      const transporterObj =
        state.catalogs.transporters.find((t) => t.id === state.ui.receptionTransporterId) ||
        state.catalogs.transporters[0];

      const bins = state.ui.receptionBins;
      const tareWeightKg = bins * 42;
      const grossWeightKg = state.ui.receptionGrossKg;
      const netWeightKg = Math.max(100, grossWeightKg - tareWeightKg);
      const newLotId = getNextLotId();

      state.lots.unshift({
        id: newLotId,
        species: state.ui.receptionSpecies,
        variety: state.ui.receptionVariety,
        producerId: producerObj.predioCode,
        producer: producerObj.name,
        producerRut: producerObj.rut,
        predioCode: producerObj.predioCode,
        transporter: `${transporterObj.company} (${transporterObj.plate})`,
        exporter: producerObj.exporter,
        guide,
        harvestDate,
        harvestDateLocked: true,
        bins,
        grossWeightKg,
        tareWeightKg,
        weightKg: netWeightKg,
        observations: state.ui.receptionObservations.trim() || 'Ingreso conforme en romana.',
        date: '17 Nov 2026',
        status: 'RECEPCIONADO',
        reason: 'Recepcionado en romana; pendiente de evaluación fitosanitaria.',
        propagationMs: 0,
        quality: null,
      });

      // Preparar siguiente correlativo y seleccionar en Calidad
      state.ui.qualitySelectedLotId = newLotId;
      state.ui.receptionGuide = `GD-${44860 + state.lots.length}`;
      state.ui.receptionScaleCaptured = false;
      state.ui.receptionGrossKg = 0;
      state.ui.receptionObservations = '';

      pushAudit('Lote recepcionado', `${newLotId} · ${fmtNum(netWeightKg)} kg netos · Fecha cosecha bloqueada`);
      showToast(
        `Recepción ${newLotId} confirmada`,
        `Estado RECEPCIONADO · Fecha de cosecha (${harvestDate}) bloqueada inmutablemente.`,
        'success'
      );
      render();
    }

    function togglePdaConnection() {
      state.pdaOnline = !state.pdaOnline;
      if (state.pdaOnline) {
        pushAudit('Wi-Fi restablecido', 'Colector PDA reconectado en cámara -2.0 °C');

          render();
          syncSqliteQueueNow();
          return;
        } else {
          showToast('Conexión activa', 'Wi-Fi Planta restablecido.', 'info');
        }
      } else {
        pushAudit('Modo Offline SQLite', 'Sin señal Wi-Fi en Cámara -2.0 °C (AES-256 activo)');
        showToast('Sin conexión · Modo Offline', 'Los movimientos se cifrarán con AES-256 en SQLite local.', 'warning');
      }

    }

    function selectPdaPallet(palletId) {
      state.ui.pdaSelectedPalletId = palletId;
      render();
    }

    function selectPdaRack(rack) {
      state.ui.pdaSelectedRack = rack;
      render();
    }

    function enqueuePalletMove(pallet, rack) {
      const txUuid = `TX-${pallet.id}-${rack.replace(/\s+/g, '')}-${Date.now().toString().slice(-4)}`;
      const aesPayload = btoa(`${pallet.id}|${rack}|-2.0C|${nowTimeStr()}`).slice(0, 26);

      if (state.pdaOnline) {
        pallet.location = rack;
        pallet.syncStatus = 'SINCRONIZADO';
        pushAudit('Ubicación asignada', `${pallet.id} · ${rack.replace(' · ', ' / ')}`);
      } else {
        // Evitar duplicados en cola local por mismo pallet
        state.sqliteQueue = state.sqliteQueue.filter((item) => item.palletId !== pallet.id);
        state.sqliteQueue.unshift({
          txUuid,
          palletId: pallet.id,
          variety: pallet.variety,
          rack,
          time: nowTimeStr(),
          aesCipher: `AES256:${aesPayload}==`,
        });
        persistSqliteQueue(state.sqliteQueue);
        pallet.location = `${rack} (Local SQLite)`;
        pallet.syncStatus = 'ENCRIPTADO LOCAL';
        pushAudit('Registro SQLite Offline', `${pallet.id} · ${rack.replace(' · ', ' / ')} (AES-256)`);
      }
    }

    function confirmSinglePdaMove() {
      const pallet = state.pallets.find((p) => p.id === state.ui.pdaSelectedPalletId);
      const rack = state.ui.pdaSelectedRack;
      if (!pallet) return;

      enqueuePalletMove(pallet, rack);
      if (state.pdaOnline) {
        showToast('Ubicación confirmada', `${pallet.id} ubicado en ${rack}.`, 'success');
      } else {
        showToast(
          'Guardado encriptado en SQLite',
          `${pallet.id} almacenado localmente (${state.sqliteQueue.length} / 10.000).`,
          'warning'
        );
      }
      render();
    }

    function scanBatchFivePallets() {
      const rack = state.ui.pdaSelectedRack;
      // Garantizar al menos 5 pallets disponibles para demostración de lote de 5 escaneos
      while (state.pallets.length < 5) {
        const nextId = getNextPalletId();
        state.pallets.push({
          id: nextId,
          orderCode: 'Orden #101',
          lotId: 'REC-2026-001',
          species: 'Cereza',
          variety: 'Santina',
          producer: 'Agrícola Santa Elena',
          producerRut: '76.412.890-3',
          predioCode: 'PRD-001',
          exporter: 'Valle Sur S.A.',
          market: 'China / Asia',
          boxes: 96,
          weightKg: 480,
          packagingDesc: 'Caja Cartón Exportación 5 kg',
          gs1Code: `(01)07804650001012(10)REC2026001(21)${nextId.replace(/-/g, '')}`,
          location: 'Sin asignar',
          syncStatus: 'SINCRONIZADO',
          createdAt: '17 Nov 2026 · 10:45',
        });
      }

      const targets = state.pallets.slice(0, 5);
      targets.forEach((p) => enqueuePalletMove(p, rack));

      if (state.pdaOnline) {
        showToast('Lote de 5 pallets ubicado', `5 unidades asignadas a ${rack} en tiempo real.`, 'success');
      } else {
        showToast(
          '5 pallets cifrados en SQLite',
          `5 movimientos guardados localmente con AES-256 (${state.sqliteQueue.length} / 10.000).`,
          'warning'
        );
      }
      render();
    }

    function syncSqliteQueueNow() {
      if (!state.pdaOnline) {
        showToast('Sin conexión Wi-Fi', 'Activa la conexión Wi-Fi Planta para sincronizar la cola local.', 'danger');
        return;
      }
      if (state.sqliteQueue.length === 0 || state.pdaSyncing) return;

      state.pdaSyncing = true;
      state.pdaSyncProgress = 25;
      render();

      const totalToSync = state.sqliteQueue.length;

      setTimeout(() => {
        state.pdaSyncProgress = 75;
        render();
      }, 450);

      setTimeout(() => {
        state.sqliteQueue.forEach((entry) => {
          const p = state.pallets.find((item) => item.id === entry.palletId);
          if (p) {
            p.location = entry.rack;
            p.syncStatus = 'SINCRONIZADO';
          }
        });
        state.sqliteQueue = [];
        persistSqliteQueue([]);
        state.pdaSyncing = false;
        state.pdaSyncProgress = 100;

        pushAudit('Sincronización SQLite (<5s)', `${totalToSync} registro(s) consolidados sin duplicados`);
        showToast(
          'Sincronización completada (< 5 s)',
          `${totalToSync} registro(s) desencriptados y volcados al servidor central.`,
          'success'
        );
        render();
      }, 1100);
    }

    function submitWarehouseRestock(event) {
      event.preventDefault();
      const code = document.getElementById('restock-item-code').value;
      const qty = parseInt(document.getElementById('restock-item-qty').value, 10) || 0;
      const mat = state.materials.find((m) => m.code === code);
      if (mat && qty > 0) {
        mat.physical += qty;
        pushAudit('Reposición bodega', `+${fmtNum(qty)} ${mat.unit} · ${mat.code}`);
        showToast('Inventario actualizado', `Se ingresaron ${fmtNum(qty)} ${mat.unit} a ${mat.name}.`, 'success');
      }
      closeModal();
      render();
    }

                          <circle cx="48" cy="48" r="18" fill="#BE123C" stroke="#FDA4AF" stroke-width="1.5"/>

              </div>

              <!-- Dictamen fitosanitario -->
              <div>
                <label class="block text-xs font-semibold text-[#111C17] mb-2">Clasificación del estado del lote</label>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">

                    onclick="setQualityDraftVerdict('ACEPTADO')"

                    <span>✓</span>
                    <span>ACEPTADO</span>
                  </button>

                  <button
                    type="button"
                    onclick="setQualityDraftVerdict('OBSERVADO')"
                    class="btn-industrial rounded-xl border-2 font-mono text-xs font-bold uppercase tracking-wider flex items-center justify-center gap-2 ${
                      draft === 'OBSERVADO'
                        ? 'bg-[#FEF3E2] border-[#B45309] text-[#B45309]'
                        : 'bg-white border-[#E2E8E4] text-[#5C6F65] hover:border-[#D0DBD3]'

                    <span>~</span>
                    <span>OBSERVADO</span>
                  </button>

                  <button
                    type="button"
                    onclick="setQualityDraftVerdict('RECHAZADO')"
                    class="btn-industrial rounded-xl border-2 font-mono text-xs font-bold uppercase tracking-wider flex items-center justify-center gap-2 ${
                      draft === 'RECHAZADO'
                        ? 'bg-[#FDECEC] border-[#C82333] text-[#C82333]'
                        : 'bg-white border-[#E2E8E4] text-[#5C6F65] hover:border-[#D0DBD3]'

                    <span>BLOQUEADO / RECHAZADO</span>

            </form>
          </section>
        </div>

    // --- 11.3 RECEPCIÓN Y EMPAQUE (Osvaldo Ruiz) ---

      const bins = state.ui.receptionBins;
      const tareTotal = bins * 42;
      const grossKg = state.ui.receptionScaleCaptured ? state.ui.receptionGrossKg : 0;
      const netKg = state.ui.receptionScaleCaptured ? Math.max(0, grossKg - tareTotal) : 0;

      const selectedProducer =
        state.catalogs.producers.find((p) => p.predioCode === state.ui.receptionProducerId) ||
        state.catalogs.producers[0];

      // Especies únicas y variedades filtradas por especie
      const uniqueSpecies = [...new Set(state.catalogs.speciesVarieties.map((sv) => sv.species))];
      const filteredVarieties = state.catalogs.speciesVarieties
        .filter((sv) => sv.species === state.ui.receptionSpecies)
        .map((sv) => sv.variety);

      // Datos para pestaña Etiquetas QR ZPL
      const validOrders = state.orders.filter((o) => {
        const l = state.lots.find((item) => item.id === o.lotId);
        return l && l.status === 'ACEPTADO';
      });
      const selectedOrder =
        validOrders.find((o) => o.code === state.ui.qrSelectedOrderCode) || validOrders[0];
      const previewPallet =
        state.pallets.find((p) => p.id === state.ui.selectedQrPalletId) || state.pallets[0];

      return `

            Recepción y empaque

            type="button"

              tab === 'romana'

            <span>Recepción y romana</span>

            <span>Etiquetas QR</span>

        ${
          tab === 'romana'

                  >
                    <span>↻</span>
                    <span>Sincronizar ${pendingCount} registros pendientes</span>
                  </button>
                </div>
              </section>
            </div>

            <!-- Registros pendientes encriptados AES-256 en SQLite local -->
            ${
              pendingCount > 0
                ? `
              <section class="rounded-2xl bg-[#14252B] border border-[#F59E0B]/60 p-5">
                <div class="flex items-center justify-between mb-3">
                  <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-[#FBBF24] animate-pulse"></span>
                    <h3 class="font-mono text-xs font-bold uppercase text-[#FBBF24]">
                      REGISTROS EN COLA LOCAL SQLITE (PENDIENTES DE SINCRONIZACIÓN)
                    </h3>
                  </div>
                  <span class="font-mono text-xs text-slate-300">${pendingCount} / 10.000</span>
                </div>
                <div class="space-y-2">
                  ${state.sqliteQueue
                    .map(
                      (item) => `
                    <div class="p-3 rounded-xl bg-[#0E1A1E] border border-[#233B44] flex flex-wrap items-center justify-between gap-2 text-xs">
                      <div class="flex items-center gap-3">
                        <span class="font-mono font-bold text-white">${item.palletId}</span>
                        <span class="text-slate-300">→ ${item.rack}</span>
                        <span class="font-mono text-[11px] text-slate-500">${item.aesCipher}</span>
                      </div>
                      <span class="px-2.5 py-1 rounded-full bg-[#3B2610] border border-[#F59E0B] font-mono text-[10px] font-bold text-[#FBBF24]">
                        🔒 ENCRIPTADO LOCAL
                      </span>
                    </div>
                  `
                    )
                    .join('')}
                </div>
              </section>
            `
                : ''
            }
          </div>
        </div>
      `;
    }

    // --- 11.5 BODEGA DE INSUMOS (Marcelo Rojas) ---
    function renderWarehouseView() {
      const q = state.ui.warehouseSearch.toLowerCase();
      const filtered = state.materials.filter(
        (m) => m.code.toLowerCase().includes(q) || m.name.toLowerCase().includes(q)
      );
      const alertsCount = state.materials.filter((m) => m.physical - m.committed <= m.minAlert).length;

      return `
        <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 mb-6">
          <div>
            <p class="font-mono text-xs font-bold uppercase tracking-[0.12em] text-[#157A45] mb-1">
              CONTROL DE MATERIALES
            </p>
            <h1 class="text-3xl sm:text-4xl font-extrabold text-[#111C17] tracking-tight">
              Bodega de insumos
            </h1>
            <p class="text-sm text-[#5C6F65] mt-1">
              Inventario físico, compromisos por órdenes activas y alertas de reposición.
            </p>
          </div>

          <button
            type="button"
            onclick="openWarehouseRestockModal()"
            class="btn-industrial px-5 rounded-xl bg-[#0E3B25] hover:bg-[#144D31] text-white font-semibold text-sm inline-flex items-center gap-2 self-start sm:self-auto shadow-sm"
          >
            <span class="text-lg leading-none">+</span>
            <span>Ingresar reposición</span>
          </button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
          <div class="card-industrial p-5">
            <p class="font-mono text-[11px] font-bold uppercase text-[#5C6F65]">ÍTEMS CONTROLADOS</p>
            <p class="font-mono text-3xl font-bold text-[#111C17] mt-1">${state.materials.length}</p>
            <p class="text-xs text-[#5C6F65] mt-0.5">Catálogo operacional</p>
          </div>
          <div class="card-industrial p-5">
            <p class="font-mono text-[11px] font-bold uppercase text-[#5C6F65]">STOCK VALORIZADO</p>
            <p class="font-mono text-3xl font-bold text-[#111C17] mt-1">$18.4M</p>
            <p class="text-xs text-[#5C6F65] mt-0.5">CLP estimado</p>
          </div>
          <div class="card-industrial p-5">
            <p class="font-mono text-[11px] font-bold uppercase text-[#5C6F65]">ÓRDENES COMPROMETIDAS</p>
            <p class="font-mono text-3xl font-bold text-[#111C17] mt-1">${state.orders.length}</p>
            <p class="text-xs text-[#5C6F65] mt-0.5">Consumo proyectado</p>
          </div>
          <div class="card-industrial p-5">
            <p class="font-mono text-[11px] font-bold uppercase text-[#5C6F65]">ALERTAS ACTIVAS</p>
            <p class="font-mono text-3xl font-bold text-[#111C17] mt-1">${alertsCount}</p>
            <p class="text-xs text-[#5C6F65] mt-0.5">Stock bajo mínimo</p>
          </div>
        </div>

        <section class="card-industrial overflow-hidden">
          <div class="p-6 flex flex-wrap items-center justify-between gap-4 border-b border-[#E2E8E4]">
            <div class="flex items-center gap-3">
              <span class="w-7 h-7 rounded-lg bg-[#E6F5EC] text-[#157A45] font-mono text-xs font-bold flex items-center justify-center">01</span>
              <h2 class="text-lg font-bold text-[#111C17]">Disponibilidad por insumo</h2>
            </div>

            <input
              type="text"
              value="${state.ui.warehouseSearch}"
              oninput="updateWarehouseSearch(this.value)"
              placeholder="Buscar insumo..."
              class="w-full sm:w-56 h-10 px-3.5 rounded-xl bg-[#F6F8F6] border border-[#E2E8E4] text-xs font-medium text-[#111C17] focus:outline-none focus:border-[#0E3B25]"
            />
          </div>

          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="bg-[#F6F8F6] border-b border-[#E2E8E4] font-mono text-[11px] font-bold uppercase text-[#5C6F65]">
                  <th class="py-3.5 px-6">INSUMO</th>
                  <th class="py-3.5 px-6">STOCK FÍSICO</th>
                  <th class="py-3.5 px-6">COMPROMETIDO</th>
                  <th class="py-3.5 px-6">DISPONIBLE NETO</th>
                  <th class="py-3.5 px-6">ESTADO</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-[#E2E8E4]">
                ${filtered
                  .map((m) => {
                    const net = m.physical - m.committed;
                    const isLow = net <= m.minAlert;
                    return `
                    <tr class="hover:bg-[#F8FAF8]">
                      <td class="py-4 px-6">
                        <p class="font-mono text-[11px] font-semibold text-[#5C6F65]">${m.code}</p>
                        <p class="text-sm font-bold text-[#111C17]">${m.name}</p>
                      </td>
                      <td class="py-4 px-6 font-mono text-sm font-bold">${fmtNum(m.physical)} <span class="text-xs font-normal text-[#5C6F65]">${m.unit}</span></td>
                      <td class="py-4 px-6 font-mono text-sm text-[#5C6F65]">${fmtNum(m.committed)} ${m.unit}</td>
                      <td class="py-4 px-6 font-mono text-sm font-bold ${isLow ? 'text-[#B45309]' : 'text-[#111C17]'}">${fmtNum(net)} ${m.unit}</td>
                      <td class="py-4 px-6">${renderStatusBadge(isLow ? 'STOCK BAJO' : 'ÓPTIMO')}</td>
                    </tr>
                  `;
                  })
                  .join('')}
              </tbody>
            </table>
          </div>
        </section>
      `;
    }

    // --- 11.6 PORTAL EXPORTADOR (Valle Sur S.A.) ---
    function renderExporterView() {
      const clientCompany = 'Valle Sur S.A.';
      const query = state.ui.exporterSearch.toLowerCase();

      const allClientLots = state.lots.filter((l) => l.exporter === clientCompany);
      const clientLots = allClientLots.filter(
        (l) =>
          l.id.toLowerCase().includes(query) ||
          l.variety.toLowerCase().includes(query) ||
          l.producer.toLowerCase().includes(query)
      );
      const clientPallets = state.pallets.filter((p) => p.exporter === clientCompany);

      const approvedKg = allClientLots
        .filter((l) => l.status === 'ACEPTADO')
        .reduce((acc, l) => acc + l.weightKg, 0);
      const approvedTons = (approvedKg / 1000).toFixed(1);

      return `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
          <div>
            <p class="font-mono text-xs font-bold uppercase tracking-[0.12em] text-[#157A45] mb-1">
              PORTAL CLIENTE · TEMPORADA 2026
            </p>
            <h1 class="text-3xl sm:text-4xl font-extrabold text-[#111C17] tracking-tight">
              Buenos días, Valle Sur
            </h1>
            <p class="text-sm text-[#5C6F65] mt-1">
              Visibilidad en tiempo real de su fruta en proceso y cámaras de frío.
            </p>
          </div>

          <div class="px-4 py-3 rounded-2xl bg-[#F2F9F5] border border-[#CFE6D8] inline-flex items-center gap-3 self-start sm:self-auto">
            <span class="text-[#157A45] font-bold">🛡</span>
            <div class="font-mono">
              <p class="text-[11px] font-bold uppercase text-[#157A45]">DATOS PROTEGIDOS</p>
              <p class="text-[10px] font-semibold text-[#5C6F65]">VISTA EXCLUSIVA VALLE SUR S.A.</p>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
          <div class="card-industrial p-5">
            <p class="font-mono text-[11px] font-bold uppercase text-[#5C6F65]">LOTES TOTALES</p>
            <p class="font-mono text-3xl font-bold text-[#111C17] mt-1">${allClientLots.length}</p>
            <p class="text-xs text-[#5C6F65] mt-0.5">Asignados a su cuenta</p>
          </div>
          <div class="card-industrial p-5">
            <p class="font-mono text-[11px] font-bold uppercase text-[#5C6F65]">KILOGRAMOS APROBADOS</p>
            <p class="font-mono text-3xl font-bold text-[#111C17] mt-1">${approvedTons} t</p>
            <p class="text-xs text-[#5C6F65] mt-0.5">Con certificación vigente</p>
          </div>
          <div class="card-industrial p-5">
            <p class="font-mono text-[11px] font-bold uppercase text-[#5C6F65]">PALLETS TERMINADOS</p>
            <p class="font-mono text-3xl font-bold text-[#111C17] mt-1">${clientPallets.length}</p>
            <p class="text-xs text-[#5C6F65] mt-0.5">${clientPallets.filter((p) => p.location !== 'Sin asignar').length} ubicados en cámara</p>
          </div>
          <div class="card-industrial p-5">
            <p class="font-mono text-[11px] font-bold uppercase text-[#5C6F65]">CONFORMIDAD</p>
            <p class="font-mono text-3xl font-bold text-[#111C17] mt-1">100%</p>
            <p class="text-xs text-[#5C6F65] mt-0.5">Sin despachos bloqueados</p>
          </div>
        </div>

        <section class="card-industrial p-6">
          <div class="flex flex-wrap items-center justify-between gap-4 border-b border-[#E2E8E4] pb-4 mb-5">
            <div class="flex items-center gap-3">
              <span class="w-7 h-7 rounded-lg bg-[#E6F5EC] text-[#157A45] font-mono text-xs font-bold flex items-center justify-center">01</span>
              <h2 class="text-lg font-bold text-[#111C17]">Trazabilidad de su inventario</h2>
            </div>

            <div class="flex items-center gap-2 w-full sm:w-auto">
              <input
                type="text"
                value="${state.ui.exporterSearch}"
                oninput="updateExporterSearch(this.value)"
                placeholder="Buscar lote o pallet..."
                class="flex-grow sm:w-52 h-10 px-3.5 rounded-xl bg-[#F6F8F6] border border-[#E2E8E4] text-xs font-medium text-[#111C17] focus:outline-none focus:border-[#0E3B25]"
              />
              <button
                type="button"
                onclick="openTraceabilityLookupModal(state.ui.exporterSearch)"
                class="h-10 px-4 rounded-xl bg-[#0E3B25] text-white text-xs font-bold shrink-0"
              >
                Ver genealogía
              </button>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
            ${clientLots
              .map((lot) => {
                const lotPallets = clientPallets.filter((p) => p.lotId === lot.id);
                const qualitySummary = lot.quality
                  ? `${lot.quality.brix} °Brix · ${lot.quality.defects}% defectos`
                  : 'En análisis';

                return `
                <div class="rounded-2xl border border-[#E2E8E4] bg-white p-5 flex flex-col justify-between">
                  <div>
                    <div class="flex items-start justify-between gap-3 mb-4">
                      <div>
                        <h3 class="text-base font-bold text-[#111C17]">${lot.species} ${lot.variety}</h3>
                        <p class="font-mono text-xs text-[#5C6F65]">${lot.id} · ${lot.producer} (${lot.predioCode})</p>
                      </div>
                      ${renderStatusBadge(lot.status)}
                    </div>

                    <div class="rounded-xl bg-[#F6F8F6] p-4 grid grid-cols-2 gap-y-3 gap-x-4 text-xs">
                      <div>
                        <p class="text-[#5C6F65]">Cosecha / Ingreso</p>
                        <p class="font-mono font-bold text-[#111C17] mt-0.5">${lot.harvestDate}</p>
                      </div>
                      <div>
                        <p class="text-[#5C6F65]">Peso recibido</p>
                        <p class="font-mono font-bold text-[#111C17] mt-0.5">${fmtNum(lot.weightKg)} kg</p>
                      </div>
                      <div>
                        <p class="text-[#5C6F65]">Resultado calidad</p>
                        <p class="font-mono font-bold text-[#111C17] mt-0.5">${qualitySummary}</p>
                      </div>
                      <div>
                        <p class="text-[#5C6F65]">Producción</p>
                        <p class="font-mono font-bold text-[#111C17] mt-0.5">${lotPallets.length} pallets</p>
                      </div>
                    </div>
                  </div>

                  ${
                    lotPallets.length > 0
                      ? `
                    <div class="mt-4 pt-2 divide-y divide-[#E2E8E4]">
                      ${lotPallets
                        .map(
                          (p) => `
                        <button
                          type="button"
                          onclick="openTraceabilityLookupModal('${p.id}')"
                          class="w-full py-2.5 flex items-center justify-between text-xs hover:bg-[#F8FAF8] px-1 rounded"
                        >
                          <span class="font-mono font-bold text-[#0E3B25]">📍 ${p.id}</span>
                          <span class="font-mono font-semibold text-[#5C6F65]">${p.location}</span>
                        </button>
                      `
                        )
                        .join('')}
                    </div>
                  `
                      : ''
                  }
                </div>
              `;
              })
              .join('')}
          </div>
        </section>
      `;
    }

    /* ==========================================================================
       12. ORQUESTADOR DE RENDERIZADO GLOBAL
       ========================================================================== */

    function render() {
      const root = document.getElementById('app');
      if (!root) return;

      if (!state.isAuthenticated) {
        root.innerHTML = renderLoginView();
        return;
      }

      let stationHtml = '';
      switch (state.activeProfileId) {
        case 'admin':
          stationHtml = renderAdminView();
          break;
        case 'quality':
          stationHtml = renderQualityView();
          break;
        case 'operator':
          stationHtml = renderReceptionView();
          break;
        case 'pda':
          stationHtml = renderPdaArcticView();
          break;
        case 'warehouse':
          stationHtml = renderWarehouseView();
          break;
        case 'exporter':
          stationHtml = renderExporterView();
          break;
        default:
          stationHtml = renderAdminView();
      }

      root.innerHTML = `
        ${renderGlobalHeader()}
        <main class="flex-grow max-w-[1440px] w-full mx-auto px-4 sm:px-6 pt-6 pb-24">
          ${stationHtml}
        </main>
        ${renderLiveAuditBar()}
      `;
    }

    window.addEventListener('DOMContentLoaded', () => {
      render();
    });
  </script>
</body>
</html>
