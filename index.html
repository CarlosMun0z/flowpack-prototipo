    /* Botones táctiles industriales (>= 80px en acciones críticas de planta y frío) */
    .btn-touch-80 {
      min-height: 80px;

      user-select: none;
    }

    }
    .btn-touch-80:disabled {
      cursor: not-allowed;
    }

      try {

        if (!raw) return [];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
      } catch (e) {
        return [];

    function formatChileanRut(raw) {
      const clean = raw.replace(/[^0-9kK]/g, '').toUpperCase();
      if (clean.length < 2) return clean;
      const body = clean.slice(0, -1);
      const dv = clean.slice(-1);
      const formattedBody = body.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      return `${formattedBody}-${dv}`;
    }

    function isValidChileanRutFormat(rut) {
      return /^\d{1,2}\.\d{3}\.\d{3}-[0-9K]$/.test(rut.trim().toUpperCase());
    }

    /* Alarma sonora real vía Web Audio API para rechazos en Andén de Despacho */
    function playIndustrialAlarmSound() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;

        [0, 0.22, 0.44].forEach((offset) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(880, now + offset);
          osc.frequency.exponentialRampToValueAtTime(520, now + offset + 0.17);
          gain.gain.setValueAtTime(0.24, now + offset);
          gain.gain.exponentialRampToValueAtTime(0.01, now + offset + 0.18);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + offset);
          osc.stop(now + offset + 0.19);
        });
      } catch (e) {
        // Ignorar si el navegador bloquea audio sin interacción
      }
    }

    function generateQrSvg(text, size = 148) {
      const grid = 21;
      const cell = size / grid;
      let hash = 2166136261;
      for (let i = 0; i < text.length; i++) {
        hash ^= text.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }

      const isFinder = (r, c) =>
        (r < 7 && c < 7) || (r < 7 && c >= grid - 7) || (r >= grid - 7 && c < 7);

      const isFinderDark = (r, c) => {
        const lr = r < 7 ? r : r - (grid - 7);
        const lc = c < 7 ? c : c - (grid - 7);
        return lr === 0 || lr === 6 || lc === 0 || lc === 6 || (lr >= 2 && lr <= 4 && lc >= 2 && lc <= 4);
      };

      let rects = `<rect width="${size}" height="${size}" fill="#FFFFFF"/>`;
      for (let r = 0; r < grid; r++) {
        for (let c = 0; c < grid; c++) {
          let dark = false;
          if (isFinder(r, c)) {
            dark = isFinderDark(r, c);
          } else if (r === 6 || c === 6) {
            dark = (r + c) % 2 === 0;
          } else {
            const v = Math.abs(Math.imul(hash ^ (r * 31 + c * 17), 2654435761));
            dark = v % 100 < 48;
          }
          if (dark) {
            rects += `<rect x="${(c * cell).toFixed(2)}" y="${(r * cell).toFixed(2)}" width="${(cell + 0.25).toFixed(2)}" height="${(cell + 0.25).toFixed(2)}" fill="#111C17"/>`;
          }
        }
      }

      return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg" class="border border-[#111C17] rounded-md bg-white">${rects}</svg>`;
    }

    function handleCredentialLogin(event) {
      event.preventDefault();
      const email = document.getElementById('login-email-input').value.trim().toLowerCase();
      const password = document.getElementById('login-pass-input').value.trim();

      appState.loginEmail = email;
      appState.loginPassword = password;

      const found = PROFILES.find((p) => p.email.toLowerCase() === email);
      if (!found || !password) {
        appState.loginError = 'Credenciales no reconocidas. Verifica tu correo corporativo o selecciona una estación abajo.';
        render();
        return;
      }

      appState.loginError = '';
      appState.activeProfileId = found.id;
      appState.isAuthenticated = true;
      pushAudit('Acceso estación', `${found.name} · ${found.role}`);
      showToast('Sesión iniciada', `Bienvenido a planta, ${found.name} (${found.role}).`, 'success');
      render();
    }

    function loginByStationCard(profileId) {
      const found = PROFILES.find((p) => p.id === profileId);
      if (!found) return;

      appState.activeProfileId = found.id;
      appState.loginEmail = found.email;
      appState.loginPassword = found.pass;
      appState.loginError = '';
      appState.isAuthenticated = true;

      pushAudit('Acceso estación', `${found.name} · ${found.role}`);
      showToast('Estación activada', `${found.name} — ${found.role}`, 'success');
      render();
    }

    function switchActiveProfile(newId) {
      const found = PROFILES.find((p) => p.id === newId);
      if (!found) return;
      appState.activeProfileId = found.id;
      pushAudit('Cambio de estación', `${found.name} · ${found.role}`);
      showToast('Cambio de perfil', `Estación activa: ${found.role}`, 'info');
      render();
    }

      const current = getActiveProfile();
      pushAudit('Cierre de sesión', `${current.name} · Turno A`);
      appState.isAuthenticated = false;

    function saveMasterProducer(event) {
      event.preventDefault();
      const name = document.getElementById('cat-prod-name').value.trim();
      const rut = formatChileanRut(document.getElementById('cat-prod-rut').value.trim());
      const predioCode = document.getElementById('cat-prod-predio-code').value.trim().toUpperCase();
      const predioName = document.getElementById('cat-prod-predio-name').value.trim();
      const exporter = document.getElementById('cat-prod-exporter').value;

      if (!isValidChileanRutFormat(rut)) {
        showToast('Formato de RUT inválido', 'Ingresa un RUT chileno válido (ej. 76.543.210-K).', 'danger');
        return;
      }

      if (appState.catalogs.producers.some((p) => p.predioCode === predioCode)) {
        showToast('Código duplicado', `El código de predio ${predioCode} ya existe.`, 'danger');
        return;
      }

      appState.catalogs.producers.push({
        id: predioCode,
        name,
        rut,
        predioCode,
        predioName,
        exporter,
      });

      appState.ui.receptionProducerId = predioCode;
      pushAudit('Catálogo productor', `${name} · RUT ${rut} (${predioCode})`);
      showToast('Ficha maestra guardada', `${name} (${predioCode}) disponible inmediatamente en Recepción.`, 'success');
      openMasterCatalogModal('producers');
      render();
    }

    function emitProcessOrder(event) {
      event.preventDefault();
      const lot = appState.lots.find((l) => l.id === appState.ui.adminSelectedLotId);
      if (!lot) return;

      if (lot.status !== 'ACEPTADO') {
        showToast('Emisión bloqueada', `El lote ${lot.id} está en estado ${lot.status}.`, 'danger');
        return;
      }

      const pkgCode = document.getElementById('admin-pkg-select').value;
      const line = document.getElementById('admin-line-select').value;
      const market = document.getElementById('admin-market-select').value;
      const pkg = appState.catalogs.packagingTypes.find((p) => p.code === pkgCode) || appState.catalogs.packagingTypes[0];

      const nextNum = getNextOrderNumber();
      const orderCode = `Orden #${nextNum}`;
      const targetBoxes = pkg.netWeightKg <= 1.5 ? 120 : 96;

      appState.orders.unshift({
        number: nextNum,
        code: orderCode,
        lotId: lot.id,
        species: lot.species,
        variety: lot.variety,
        inputKg: lot.weightKg,
        producer: lot.producer,
        producerRut: lot.producerRut,
        predioCode: lot.predioCode,
        exporter: lot.exporter,
        packagingCode: pkg.code,
        packagingDesc: pkg.description,
        unitBoxWeightKg: pkg.netWeightKg,
        line,
        market,
        targetBoxes,
        status: 'PROGRAMADA',
        createdAt: nowTimeStr(),
        massBalance: null,
      });

      appState.ui.qrSelectedOrderCode = orderCode;
      appState.ui.qrCompletedBoxes = targetBoxes;
      appState.ui.mbSelectedOrderCode = orderCode;

      appState.warehouseStock[0].committed += targetBoxes * 4;
      appState.warehouseStock[1].committed += targetBoxes * 4;

      pushAudit('Orden de proceso emitida', `${orderCode} · ${lot.id} · ${line} (${market})`);
      showToast('Pauta diaria actualizada', `${orderCode} creada y enviada a línea de empaque.`, 'success');
      render();
    }

    /* Balance de Masas y Cierre de Orden (descuenta stock real en Bodega y genera Reporte) */
    function selectMassBalanceOrder(orderCode) {
      appState.ui.mbSelectedOrderCode = orderCode;
      const ord = appState.orders.find((o) => o.code === orderCode);
      if (ord) {
        appState.ui.mbPackedKg = Math.round(ord.inputKg * 0.918);
        appState.ui.mbDiscardKg = Math.round(ord.inputKg * 0.068);
      }
      render();
    }

    function updateMassBalanceInputs() {
      const packedEl = document.getElementById('mb-packed-input');
      const discardEl = document.getElementById('mb-discard-input');
      if (packedEl) appState.ui.mbPackedKg = Math.max(0, parseFloat(packedEl.value) || 0);
      if (discardEl) appState.ui.mbDiscardKg = Math.max(0, parseFloat(discardEl.value) || 0);
      render();
    }

    function closeOrderAndDeductMaterials(event) {
      event.preventDefault();
      const ord = appState.orders.find((o) => o.code === appState.ui.mbSelectedOrderCode);
      if (!ord) return;

      if (ord.status === 'CERRADA') {
        showToast('Orden ya cerrada', `La ${ord.code} ya generó su cierre de turno y descuento.`, 'warning');
        return;
      }

      const inputKg = ord.inputKg;
      const packedKg = appState.ui.mbPackedKg;
      const discardKg = appState.ui.mbDiscardKg;
      const shrinkageKg = Math.max(0, inputKg - packedKg - discardKg);
      const shrinkagePct = ((shrinkageKg / inputKg) * 100).toFixed(2);
      const yieldPct = ((packedKg / inputKg) * 100).toFixed(2);

      // Cálculo exacto de insumos consumidos
      const boxesUsed = Math.max(1, Math.round(packedKg / ord.unitBoxWeightKg));
      const bagsUsed = boxesUsed;
      const qrRollsUsed = Math.max(1, Math.ceil(boxesUsed / 400));

      // Descuento automático del inventario real de Bodega
      const insBoxes = appState.warehouseStock.find((m) => m.code === 'INS-001');
      const insBags = appState.warehouseStock.find((m) => m.code === 'INS-002');
      const insRolls = appState.warehouseStock.find((m) => m.code === 'INS-003');

      if (insBoxes) {
        insBoxes.physical = Math.max(0, insBoxes.physical - boxesUsed);
        insBoxes.committed = Math.max(0, insBoxes.committed - boxesUsed);
      }
      if (insBags) {
        insBags.physical = Math.max(0, insBags.physical - bagsUsed);
        insBags.committed = Math.max(0, insBags.committed - bagsUsed);
      }
      if (insRolls) {

    function submitQualityClassification(event) {
      event.preventDefault();
      const t0 = performance.now();
      const lot = appState.lots.find((l) => l.id === appState.ui.qualitySelectedLotId);
      if (!lot) return;

      const sampleSize = parseInt(document.getElementById('qc-sample-input').value, 10) || 100;
      const firmnessPct = parseFloat(document.getElementById('qc-firmness-pct-input').value) || 0;
      const pressureDurofel = parseInt(document.getElementById('qc-pressure-input').value, 10) || 0;
      const caliberMm = parseFloat(document.getElementById('qc-caliber-input').value) || 0;
      const brix = parseFloat(document.getElementById('qc-brix-input').value) || 0;
      const defects = parseFloat(document.getElementById('qc-defects-input').value) || 0;
      const observations = document.getElementById('qc-obs-input').value.trim();
      const justification = document.getElementById('qc-reason-input').value.trim();

      const errBox = document.getElementById('qc-reason-error');
      if (!justification) {
        errBox.classList.remove('hidden');
        document.getElementById('qc-reason-input').focus();
        showToast('Justificación obligatoria', 'Debes ingresar el motivo técnico antes de clasificar el lote.', 'danger');
        return;
      }
      errBox.classList.add('hidden');

      const verdict = appState.ui.qualityDraftVerdict;
      const elapsedMs = Math.max(120, Math.round(performance.now() - t0 + 138));

      lot.status = verdict;
      lot.reason = justification;
      lot.propagationMs = elapsedMs;
      lot.quality = {
        sampleSize,
        firmnessPct,
        pressureDurofel,
        caliberMm,
        brix,
        defects,
        observations: observations || justification,
        photoMode: appState.ui.qualityUploadedDataUrl ? 'upload' : 'fruit_svg',
        photoDataUrl: appState.ui.qualityUploadedDataUrl,
        photoTime: appState.ui.qualityPhotoTime || `20 Nov 2026 · ${nowTimeStr()}`,
        photoHash: appState.ui.qualityPhotoHash || `SHA256-${Math.random().toString(16).substring(2, 10).toUpperCase()}`,
        inspector: 'Camila Valdés',
      };

      const titleMap = {
        ACEPTADO: 'Lote aprobado',
        OBSERVADO: 'Lote observado',
        RECHAZADO: 'Lote rechazado',
      };

      pushAudit(titleMap[verdict], `${lot.id} · ${justification.slice(0, 38)} (<1s)`);
      showToast(
        `Dictamen ${verdict} (< 1 s)`,
        `Estado de ${lot.id} propagado en 0.${elapsedMs} s a toda la planta.`,
        verdict === 'ACEPTADO' ? 'success' : 'danger'
      );
      render();
    }

    function enqueuePalletMove(pallet, rack) {
      const prevLoc = pallet.location;
      const moveLabel = `${prevLoc} -> ${rack} (${nowTimeStr().slice(0, 5)})`;
      const txUuid = `TX-${pallet.id}-${Date.now().toString().slice(-4)}`;
      const cipher = btoa(`${pallet.id}|${rack}|${nowTimeStr()}`).slice(0, 24);

      if (appState.pdaOnline) {
        pallet.location = rack;
        pallet.syncStatus = 'SINCRONIZADO';
        pallet.history.push(moveLabel);
        pushAudit('Ubicación en cámara', `${pallet.id} · ${moveLabel}`);
      } else {
        appState.sqliteQueue = appState.sqliteQueue.filter((item) => item.palletId !== pallet.id);
        appState.sqliteQueue.unshift({
          txUuid,
          palletId: pallet.id,
          prevLoc,
          rack,
          time: nowTimeStr(),
          cipher: `SQLITE:${cipher}`,
        });
        persistSqliteQueue(appState.sqliteQueue);
        pallet.location = `${rack} (Cola SQLite)`;
        pallet.syncStatus = 'PENDIENTE SYNC';
        pallet.history.push(`${moveLabel} [Offline SQLite]`);
        pushAudit('Traslado offline SQLite', `${pallet.id} -> ${rack}`);
      }
    }

    function confirmSinglePdaMove() {
      const pallet = appState.pallets.find((p) => p.id === appState.ui.pdaSelectedPalletId);
      const rack = appState.ui.pdaSelectedRack;
      if (!pallet) return;

      enqueuePalletMove(pallet, rack);
      if (appState.pdaOnline) {
        showToast('Ubicación actualizada', `${pallet.id} trasladado a ${rack}.`, 'success');
      } else {
        showToast(
          'Guardado en SQLite local',
          `${pallet.id} almacenado sin conexión (${appState.sqliteQueue.length} / 10.000).`,
          'warning'
        );
      }
      render();
    }

    function syncSqliteQueueNow() {
      if (!appState.pdaOnline) {
        showToast('Sin red Wi-Fi', 'Restablece la conexión Wi-Fi para sincronizar.', 'danger');
        return;
      }
      if (appState.sqliteQueue.length === 0 || appState.pdaSyncing) return;

      appState.pdaSyncing = true;
      appState.pdaSyncProgress = 30;
      render();

      const count = appState.sqliteQueue.length;

      setTimeout(() => {
        appState.pdaSyncProgress = 80;
        render();
      }, 400);

      setTimeout(() => {
        appState.sqliteQueue.forEach((entry) => {
          const p = appState.pallets.find((item) => item.id === entry.palletId);
          if (p) {
            p.location = entry.rack;
            p.syncStatus = 'SINCRONIZADO';
          }
        });
        appState.sqliteQueue = [];
        persistSqliteQueue([]);
        appState.pdaSyncing = false;
        appState.pdaSyncProgress = 100;

        pushAudit('Sincronización SQLite (<5s)', `${count} movimiento(s) consolidados sin duplicados`);
        showToast('Sincronización exitosa (< 5 s)', `${count} movimiento(s) actualizados en servidor central.`, 'success');
        render();
      }, 950);
    }

    function scanPalletAtDock(palletId) {
      const dispatch = appState.dispatchOrders.find((d) => d.code === appState.ui.dockSelectedOrderCode);
      const pallet = appState.pallets.find((p) => p.id === palletId);
      if (!dispatch || !pallet) return;

      // 1. Verificar bloqueo preventivo del pallet o lote retenido
      const lot = appState.lots.find((l) => l.id === pallet.lotId);
      if (pallet.status === 'BLOQUEADO' || (lot && lot.status !== 'ACEPTADO')) {
        const motivo = pallet.blockReason || (lot ? lot.reason : 'Bloqueo sanitario activo');
        pushAudit('ALERTA ANDÉN: Pallet bloqueado', `${pallet.id} rechazado en ${dispatch.code}`);
        triggerDockAlarmModal(
          pallet.id,
          'PALLET BLOQUEADO — NO CARGAR',
          `El pallet ${pallet.id} presenta restricción activa (${motivo}). Se prohíbe su adición al manifiesto de ${dispatch.code}.`
        );
        return;
      }

      // 2. Verificar compatibilidad con la orden de embarque
      if (!dispatch.assignedPallets.includes(pallet.id)) {
        pushAudit('ALERTA ANDÉN: Pallet incompatible', `${pallet.id} no pertenece a ${dispatch.code}`);
        triggerDockAlarmModal(
          pallet.id,
          'PALLET NO CORRESPONDE A LA ORDEN',
          `El pallet ${pallet.id} (${pallet.exporter}) no figura en la lista autorizada de ${dispatch.code}.`
        );
        return;
      }

      // 3. Validación exitosa
      if (dispatch.scannedPallets.includes(pallet.id)) {
        showToast('Pallet ya validado', `${pallet.id} ya fue escaneado en esta orden.`, 'info');
        return;
      }

      dispatch.scannedPallets.push(pallet.id);
      if (dispatch.scannedPallets.length >= dispatch.assignedPallets.length) {
        dispatch.status = 'CARGA COMPLETA';
      }

      pushAudit('Pallet validado en andén', `${pallet.id} · ${dispatch.code} (${dispatch.scannedPallets.length}/${dispatch.assignedPallets.length})`);
      showToast(
        `Pallet ${pallet.id} VALIDADO`,
        `Carga verificada (${dispatch.scannedPallets.length}/${dispatch.assignedPallets.length} pallets).`,
        'success'
      );
      render();
    }

    function submitPostCloseAdjustment(event) {
      event.preventDefault();
      const adminEmail = document.getElementById('adj-admin-email').value.trim().toLowerCase();
      const adminPass = document.getElementById('adj-admin-pass').value.trim();
      const code = document.getElementById('adj-item-code').value;
      const newQty = parseInt(document.getElementById('adj-new-qty').value, 10);
      const reason = document.getElementById('adj-reason').value.trim();

      const validAdminEmails = ['admin@frutalsur.cl', 'c.munoz@frutalsur.cl'];
      if (!validAdminEmails.includes(adminEmail) || adminPass.length < 6) {
        showToast('Autorización denegada', 'Credenciales de Administrador inválidas.', 'danger');
        return;
      }
      if (!reason) {
        showToast('Motivo obligatorio', 'Debes justificar el ajuste post-cierre.', 'danger');
        return;
      }

      const mat = appState.warehouseStock.find((m) => m.code === code);
      if (mat && !isNaN(newQty)) {
        const diff = newQty - mat.physical;
        mat.physical = newQty;
        const deltaStr = `${diff >= 0 ? '+' : ''}${fmtNum(diff)} ${mat.unit}`;

        appState.warehouseMovements.unshift({
          time: nowTimeStr(),
          type: 'AJUSTE POST-CIERRE',
          code: mat.code,
          name: mat.name,
          delta: deltaStr,
          author: `Admin (${adminEmail})`,
          note: reason,
        });

        pushAudit('Ajuste stock post-cierre', `${mat.code} (${deltaStr}) · Autorizado por ${adminEmail}`);
        showToast('Ajuste auditado aplicado', `${mat.name} actualizado a ${fmtNum(newQty)} ${mat.unit}.`, 'warning');
      }

      closeModal();
      render();
    }

                        .map(
                          (d) => `
                        <option value="${d.code}" ${selectedDispatch && d.code === selectedDispatch.code ? 'selected' : ''}>
                          ${d.code} — ${d.exporter} (${d.scannedPallets.length}/${d.assignedPallets.length} pallets)
                        </option>
                      `
                        )
                        .join('')}
                    </select>
                  </div>

                  ${
                    selectedDispatch
                      ? `
                    <div class="p-4 rounded-2xl bg-[#0E3B25] text-white space-y-2">
                      <div class="flex items-center justify-between">
                        <p class="font-mono text-sm font-extrabold text-[#D4EE49]">${selectedDispatch.code}</p>
                        ${renderStatusBadge(selectedDispatch.status)}
                      </div>
                      <p class="text-xs">Cliente: <strong>${selectedDispatch.exporter}</strong> · ${selectedDispatch.destination}</p>
                      <p class="font-mono text-[11px] text-white/75">${selectedDispatch.transport}</p>
                      <div class="pt-2 border-t border-white/15 flex items-center justify-between font-mono text-xs">
                        <span>Pallets requeridos: ${selectedDispatch.assignedPallets.join(', ')}</span>
                        <span class="text-[#D4EE49] font-extrabold">Progreso: ${selectedDispatch.scannedPallets.length} / ${selectedDispatch.assignedPallets.length}</span>
                      </div>
                    </div>

                    <div>
                      <p class="font-mono text-[11px] font-bold uppercase text-[#5C6F65] mb-2">MANIFIESTO DE CARGA VALIDADO</p>
                      <div class="space-y-2">
                        ${selectedDispatch.assignedPallets
                          .map((pid) => {
                            const isScanned = selectedDispatch.scannedPallets.includes(pid);
                            return `
                            <div class="p-3 rounded-xl border flex items-center justify-between ${
                              isScanned ? 'bg-[#E6F5EC] border-[#157A45]' : 'bg-[#F6F8F6] border-[#E2E8E4]'
                            }">
                              <span class="font-mono text-xs font-bold text-[#111C17]">${pid}</span>
                              <span class="font-mono text-[11px] font-bold ${isScanned ? 'text-[#157A45]' : 'text-[#5C6F65]'}">
                                ${isScanned ? '✓ VALIDADO EN CONTENEDOR' : 'Pendiente de escaneo'}
                              </span>
                            </div>
                          `;
                          })
                          .join('')}
                      </div>
                    </div>
                  `
                      : ''
                  }
                </div>
              </section>

              <!-- Simulación de Pistola Escáner QR en Andén -->
              <section class="lg:col-span-6 card-industrial p-6">
                <div class="border-b border-[#E2E8E4] pb-4 mb-4">
                  <span class="font-mono text-[11px] font-bold uppercase text-[#5C6F65]">LECTOR QR DE ANDÉN</span>
                  <h2 class="text-lg font-bold text-[#111C17]">Escanear pallet al ingresar al contenedor</h2>
                  <p class="text-xs text-[#5C6F65] mt-0.5">Prueba escanear un pallet válido o el pallet bloqueado <strong class="font-mono text-[#C82333]">PLT-2026-0185</strong> para verificar la alarma.</p>
                </div>

                <div class="space-y-3">
                  ${appState.pallets
                    .map((p) => {
                      const isBlocked = p.status === 'BLOQUEADO';
                      return `
                      <button
                        type="button"
                        onclick="scanPalletAtDock('${p.id}')"
                        class="btn-touch-80 w-full rounded-2xl border-2 text-left flex items-center justify-between gap-3 ${
                          isBlocked
                            ? 'bg-[#FDECEC] hover:bg-[#FADBD8] border-[#C82333]'
                            : 'bg-white hover:bg-[#F2F9F5] border-[#0E3B25]'
                        }"
                      >
                        <div>
                          <div class="flex items-center gap-2">
                            <span class="font-mono text-base font-extrabold text-[#111C17]">📷 Escanear ${p.id}</span>
                            ${renderStatusBadge(p.status)}
                          </div>
                          <p class="text-xs text-[#5C6F65] mt-1">${p.species} ${p.variety} · ${p.exporter} · ${p.location}</p>
                        </div>
                        <span class="font-mono text-xs font-extrabold px-3 py-1.5 rounded-xl ${
                          isBlocked ? 'bg-[#C82333] text-white' : 'bg-[#0E3B25] text-[#D4EE49]'
                        }">
                          ESCANEAR
                        </span>
                      </button>
                    `;
                    })
                    .join('')}
                </div>
              </section>
            </div>
          `
          }
        </div>
      `;
    }

    // --- 12.5 MARCELO ROJAS — BODEGA DE INSUMOS (REPOSICIÓN + AJUSTE POST-CIERRE) ---
    function renderWarehouseView() {
      const q = appState.ui.warehouseSearch.toLowerCase();
      const filtered = appState.warehouseStock.filter(
        (m) => m.code.toLowerCase().includes(q) || m.name.toLowerCase().includes(q)
      );

      const lowStockCount = appState.warehouseStock.filter((m) => m.physical - m.committed <= m.minAlert).length;
      const totalCommittedPct = Math.round(
        (appState.warehouseStock.reduce((s, m) => s + m.committed, 0) /
          Math.max(1, appState.warehouseStock.reduce((s, m) => s + m.physical, 0))) *
          100
      );

      return `
        <div class="flex flex-col lg:flex-row lg:items-end justify-between gap-4 mb-6">
          <div>
            <p class="font-mono text-xs font-bold uppercase tracking-[0.12em] text-[#157A45] mb-1">
              INVENTARIO Y ABASTECIMIENTO DE LÍNEA
            </p>
            <h1 class="text-3xl sm:text-4xl font-extrabold text-[#111C17] tracking-tight">
              Bodega de insumos
            </h1>
            <p class="text-sm text-[#5C6F65] mt-1">
              Stock físico, descuentos automáticos por cierre de orden y ajustes auditados post-cierre.
            </p>
          </div>

          <div class="flex flex-wrap items-center gap-2.5">
            <!-- Interruptor de Estado de Turno -->
            <button
              type="button"
              onclick="toggleWarehouseShiftStatus(${!appState.warehouseShiftClosed})"
              class="btn-industrial px-4 rounded-xl border-2 font-mono text-xs font-bold flex items-center gap-2 ${
                appState.warehouseShiftClosed
                  ? 'bg-[#FEF3E2] border-[#B45309] text-[#92400E]'
                  : 'bg-white border-[#0E3B25] text-[#0E3B25]'
              }"
            >
              <span class="w-2.5 h-2.5 rounded-full ${appState.warehouseShiftClosed ? 'bg-[#B45309]' : 'bg-[#22C55E]'}"></span>
              <span>${appState.warehouseShiftClosed ? 'TURNO CERRADO (Post-Cierre)' : 'TURNO OPERATIVO ACTIVO'}</span>
            </button>

            <button
              type="button"
              onclick="openPostCloseAdjustmentModal()"
              class="btn-industrial px-4 rounded-xl bg-white hover:bg-[#FEF3E2] border-2 border-[#B45309] text-[#92400E] font-bold text-xs sm:text-sm inline-flex items-center gap-1.5"
            >
              <span>🔒</span>
              <span>Ajuste Manual Post-Cierre</span>
            </button>

            <button
              type="button"
              onclick="openWarehouseRestockModal()"
              class="btn-industrial px-5 rounded-xl bg-[#0E3B25] hover:bg-[#165336] text-white font-semibold text-sm inline-flex items-center gap-2 shadow-sm"
            >
              <span class="text-lg text-[#D4EE49] leading-none">+</span>
              <span>Ingresar reposición</span>
            </button>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
          <div class="card-industrial p-5">
            <p class="font-mono text-[11px] font-bold uppercase text-[#5C6F65]">ÍTEMS CONTROLADOS</p>
            <p class="font-mono text-3xl font-bold text-[#111C17] mt-1">${appState.warehouseStock.length}</p>
            <p class="text-xs text-[#5C6F65] mt-0.5">Catálogo de embalaje activo</p>
          </div>

          <div class="card-industrial p-5">
            <p class="font-mono text-[11px] font-bold uppercase text-[#5C6F65]">STOCK VALORIZADO</p>
            <p class="font-mono text-3xl font-bold text-[#111C17] mt-1">$18.4M</p>
            <p class="text-xs text-[#5C6F65] mt-0.5">Inventario físico en bodega</p>
          </div>

          <div class="card-industrial p-5">
            <p class="font-mono text-[11px] font-bold uppercase text-[#5C6F65]">COMPROMETIDO</p>
            <p class="font-mono text-3xl font-bold text-[#111C17] mt-1">${totalCommittedPct}%</p>
            <p class="text-xs text-[#5C6F65] mt-0.5">Asignado a pauta diaria</p>
          </div>

          <div class="card-industrial p-5">
            <p class="font-mono text-[11px] font-bold uppercase text-[#5C6F65]">ALERTAS STOCK BAJO</p>
            <p class="font-mono text-3xl font-bold text-[#B45309] mt-1">${lowStockCount}</p>
            <p class="text-xs text-[#5C6F65] mt-0.5">Bajo umbral mínimo</p>
          </div>
        </div>

        <section class="card-industrial overflow-hidden mb-6">
          <div class="p-6 flex flex-wrap items-center justify-between gap-4 border-b border-[#E2E8E4]">
            <h2 class="text-lg font-bold text-[#111C17]">Disponibilidad por insumo</h2>
            <input
              type="text"
              value="${appState.ui.warehouseSearch}"
              oninput="updateWarehouseSearch(this.value)"
              placeholder="Buscar insumo o código..."
              class="w-60 h-10 px-3.5 rounded-xl bg-[#F6F8F6] border border-[#E2E8E4] text-xs font-medium"
            />
          </div>

          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="bg-[#F6F8F6] border-b border-[#E2E8E4] font-mono text-[11px] font-bold uppercase text-[#5C6F65]">
                  <th class="py-3.5 px-6">CÓDIGO / INSUMO</th>
                  <th class="py-3.5 px-6">FÍSICO</th>
                  <th class="py-3.5 px-6">COMPROMETIDO</th>
                  <th class="py-3.5 px-6">DISPONIBLE NETO</th>
                  <th class="py-3.5 px-6">ESTADO</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-[#E2E8E4] text-xs">
                ${filtered
                  .map((m) => {
                    const netAvailable = m.physical - m.committed;
                    const isLow = netAvailable <= m.minAlert;
                    return `
                    <tr class="hover:bg-[#F8FAF8]">
                      <td class="py-4 px-6">
                        <span class="font-mono font-bold text-[#157A45]">${m.code}</span>
                        <span class="font-bold text-[#111C17] ml-2">${m.name}</span>
                      </td>
                      <td class="py-4 px-6 font-mono font-bold">${fmtNum(m.physical)} <span class="text-[#5C6F65] font-normal">${m.unit}</span></td>
                      <td class="py-4 px-6 font-mono text-[#5C6F65]">${fmtNum(m.committed)}</td>
                      <td class="py-4 px-6 font-mono font-extrabold text-sm ${isLow ? 'text-[#B45309]' : 'text-[#111C17]'}">${fmtNum(netAvailable)}</td>
                      <td class="py-4 px-6">${renderStatusBadge(isLow ? 'STOCK BAJO' : 'ÓPTIMO')}</td>
                    </tr>
                  `;
                  })
                  .join('')}
              </tbody>
            </table>
          </div>
        </section>

        <!-- Historial de Movimientos y Ajustes Auditados -->
        <section class="card-industrial p-6">
          <h2 class="text-lg font-bold text-[#111C17] mb-3">Historial de movimientos y auditoría de bodega</h2>
          <div class="divide-y divide-[#E2E8E4]">
            ${appState.warehouseMovements
              .map(
                (mv) => `
              <div class="py-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-xs">
                <div class="flex items-center gap-3">
                  <span class="font-mono text-[#5C6F65]">${mv.time}</span>
                  <span class="px-2 py-0.5 rounded font-mono text-[10px] font-bold ${
                    mv.type.includes('AJUSTE')
                      ? 'bg-[#FEF3E2] text-[#92400E]'
                      : mv.type.includes('CONSUMO')
                      ? 'bg-[#EBF3FA] text-[#2563EB]'
                      : 'bg-[#E6F5EC] text-[#157A45]'
                  }">${mv.type}</span>
                  <div>
                    <p class="font-bold text-[#111C17]">${mv.name} <span class="font-mono text-[#0E3B25]">(${mv.delta})</span></p>
                    <p class="text-[#5C6F65]">${mv.note}</p>
                  </div>
                </div>
                <span class="font-mono text-[11px] font-semibold text-[#5C6F65]">${mv.author}</span>
              </div>
            `
              )
              .join('')}
          </div>
        </section>
      `;
    }

    // --- 12.6 VALLE SUR S.A. — PORTAL EXPORTADOR ---
    function renderExporterView() {
      const clientCompany = 'Valle Sur S.A.';
      const clientLots = appState.lots.filter((l) => l.exporter === clientCompany);
      const clientPallets = appState.pallets.filter((p) => p.exporter === clientCompany);
      const totalClientKg = clientLots.reduce((s, l) => s + l.weightKg, 0);

      return `
        <div class="flex flex-col lg:flex-row lg:items-end justify-between gap-4 mb-6">
          <div>
            <p class="font-mono text-xs font-bold uppercase tracking-[0.12em] text-[#157A45] mb-1">
              PORTAL CLIENTE · AISLAMIENTO MULTI-TENANT
            </p>
            <h1 class="text-3xl sm:text-4xl font-extrabold text-[#111C17] tracking-tight">
              ${clientCompany}
            </h1>
            <p class="text-sm text-[#5C6F65] mt-1">
              Visibilidad exclusiva de tus lotes, parámetros fitosanitarios y ubicación de pallets en tiempo real.
            </p>
          </div>

          <div class="flex items-center gap-2 w-full lg:w-auto">
            <input
              id="exporter-trace-input"
              type="text"
              value="${appState.ui.exporterSearch}"
              oninput="updateExporterSearch(this.value)"
              placeholder="Buscar PLT-2026-0184 o REC-2026-001..."
              class="field-industrial lg:w-72 font-mono text-xs"
            />
            <button
              type="button"
              onclick="openTraceabilityLookupModal(document.getElementById('exporter-trace-input').value)"
              class="btn-industrial px-5 rounded-xl bg-[#0E3B25] hover:bg-[#165336] text-white font-semibold text-sm shrink-0"
            >
              Consultar
            </button>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
          <div class="card-industrial p-5">
            <p class="font-mono text-[11px] font-bold uppercase text-[#5C6F65]">LOTES DEL EXPORTADOR</p>
            <p class="font-mono text-3xl font-bold text-[#111C17] mt-1">${clientLots.length}</p>
            <p class="text-xs text-[#5C6F65] mt-0.5">${fmtNum(totalClientKg)} kg netos recepcionados</p>
          </div>

          <div class="card-industrial p-5">
            <p class="font-mono text-[11px] font-bold uppercase text-[#5C6F65]">PALLETS TERMINADOS</p>
            <p class="font-mono text-3xl font-bold text-[#111C17] mt-1">${clientPallets.length}</p>
            <p class="text-xs text-[#5C6F65] mt-0.5">${clientPallets.reduce((s, p) => s + p.boxes, 0)} cajas embaladas</p>
          </div>

          <div class="card-industrial p-5">
            <p class="font-mono text-[11px] font-bold uppercase text-[#5C6F65]">DISPONIBILIDAD EMBARQUE</p>
            <p class="font-mono text-3xl font-bold text-[#157A45] mt-1">${clientPallets.filter((p) => p.status === 'ACTIVO').length} / ${clientPallets.length}</p>
            <p class="text-xs text-[#5C6F65] mt-0.5">Pallets activos sin retención</p>
          </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
          <section class="lg:col-span-6 card-industrial p-6">
            <h2 class="text-lg font-bold text-[#111C17] border-b border-[#E2E8E4] pb-3 mb-4">Tus lotes y calidad</h2>
            <div class="space-y-3">
              ${clientLots
                .map(
                  (l) => `
                <div class="p-4 rounded-xl border border-[#E2E8E4] bg-[#F8FAF8]">
                  <div class="flex items-center justify-between mb-1.5">
                    <span class="font-mono text-sm font-bold text-[#111C17]">${l.id} · ${l.species} ${l.variety}</span>
                    ${renderStatusBadge(l.status)}
                  </div>
                  <p class="text-xs text-[#5C6F65]">${l.producer} (${l.predioCode}) · Cosecha ${l.harvestDate} · ${fmtNum(l.weightKg)} kg</p>
                  <p class="font-mono text-[11px] text-[#0E3B25] mt-1.5">
                    ${l.quality ? `${l.quality.brix} °Brix · Presión ${l.quality.pressureDurofel} Durofel · Defectos ${l.quality.defects}%` : 'Pendiente de evaluación'}
                  </p>
                </div>
              `
                )
                .join('')}
            </div>
          </section>

          <section class="lg:col-span-6 card-industrial p-6">
            <h2 class="text-lg font-bold text-[#111C17] border-b border-[#E2E8E4] pb-3 mb-4">Tus pallets en frigorífico</h2>
            <div class="space-y-3">
              ${clientPallets
                .map(
                  (p) => `
                <div class="p-4 rounded-xl border border-[#E2E8E4] bg-white flex items-center justify-between gap-3">
                  <div>
                    <div class="flex items-center gap-2">
                      <p class="font-mono text-sm font-bold text-[#0E3B25]">${p.id}</p>
                      ${renderStatusBadge(p.status)}
                    </div>
                    <p class="text-xs text-[#5C6F65] mt-0.5">${p.species} ${p.variety} · ${p.boxes} cajas (${fmtNum(p.weightKg)} kg) · Destino ${p.market}</p>
                    <p class="font-mono text-[11px] font-semibold text-[#157A45] mt-1">Ubicación: ${p.location}</p>
                  </div>
                  <button
                    type="button"
                    onclick="openTraceabilityLookupModal('${p.id}')"
                    class="px-3 py-2 rounded-lg bg-[#F6F8F6] hover:bg-[#E6F5EC] border border-[#E2E8E4] font-mono text-[11px] font-bold text-[#0E3B25]"
                  >
                    Trazabilidad
                  </button>
                </div>
              `
                )
                .join('')}
            </div>
          </section>
        </div>
      `;
    }

    /* ==========================================================================
       13. RENDER PRINCIPAL DE LA APLICACIÓN
       ========================================================================== */

    function render() {
      const appEl = document.getElementById('app');
      if (!appEl) return;

      if (!appState.isAuthenticated) {
        appEl.innerHTML = renderLoginView();
        return;
      }

      let workspaceHtml = '';
      switch (appState.activeProfileId) {
        case 'admin':
          workspaceHtml = renderAdminView();
          break;
        case 'quality':
          workspaceHtml = renderQualityView();
          break;
        case 'operator':
          workspaceHtml = renderReceptionView();
          break;
        case 'pda':
          workspaceHtml = renderPdaFrigorificoView();
          break;
        case 'warehouse':
          workspaceHtml = renderWarehouseView();
          break;
        case 'exporter':
          workspaceHtml = renderExporterView();
          break;
        default:
          workspaceHtml = renderAdminView();
      }

      appEl.innerHTML = `
        ${renderGlobalHeader()}
        <main class="flex-grow max-w-[1440px] w-full mx-auto px-4 sm:px-6 pt-7 pb-24">
          ${workspaceHtml}
        </main>
        ${renderLiveAuditBar()}
      `;
    }

    window.onload = function () {
      render();
    };
  </script>
</body>
</html>
