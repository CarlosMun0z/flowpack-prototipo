    let appState = loadState();

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          const initial = getCleanInitialState();
          localStorage.setItem(STORAGE_KEY, JSON.stringify(initial));
          return initial;
        }
        return JSON.parse(raw);
      } catch (e) {
        return getCleanInitialState();
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (e) {
        console.error('Error guardando estado local:', e);
      }
      updateAlertsBadge();
      updateOfflineBanner();
    }

    function logAudit(action) {
      const roleMap = {
        jefe: ['Carlos Muñoz', 'Jefe de Planta'],
        recepcion: ['Osvaldo Ruiz', 'Recepción y Empaque'],
        calidad: ['Camila Valdés', 'Control de Calidad'],
        bodega: ['Marcelo Rojas', 'Bodega de Insumos'],
        frigorifico: ['Enrique Valenzuela', 'Frigorífico y Andén'],
        client_vallesur: ['Portal Valle Sur S.A.', 'Cliente Exportador'],
        client_andes: ['Portal Andes Export Ltda.', 'Cliente Exportador']
      };
      const [user, role] = roleMap[appState.currentRole] || ['Sistema', 'Operación'];
      const now = new Date();
      const time = now.toTimeString().slice(0, 5);
      appState.auditLogs.unshift({ time, user, role, action });
      if (appState.auditLogs.length > 60) appState.auditLogs.pop();
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const colors = {
        success: 'bg-forest-800 text-white border-limebrand-400',
        error: 'bg-red-700 text-white border-red-300',
        warning: 'bg-amber-500 text-amber-950 border-amber-800'
      };
      const el = document.createElement('div');
      el.className = `pointer-events-auto p-3.5 rounded-xl border-l-4 shadow-xl text-xs sm:text-sm font-semibold flex items-start justify-between gap-3 transition-all ${colors[type] || colors.success}`;
      el.innerHTML = `<span>${message}</span><button onclick="this.parentElement.remove()" class="opacity-75 hover:opacity-100 font-bold">✕</button>`;
      container.appendChild(el);
      setTimeout(() => { if (el.parentElement) el.remove(); }, 4500);
    }

    // =========================================================================
    // 2. SISTEMA DE ALERTAS OPERACIONALES AUTOMÁTICAS (HU-20)
    // =========================================================================
    function computeOperationalAlerts() {
      const alerts = [];
      // Lotes observados o rechazados sin procesar
      appState.lots.forEach(l => {
        if (l.qualityStatus === 'OBSERVADO') {
          alerts.push({
            level: 'warning',
            code: 'CALIDAD',
            title: `Lote ${l.id} en estado OBSERVADO`,
            desc: `${l.producerName} (${l.variety}) requiere resolución técnica antes de ingresar a línea.`
          });
        } else if (l.qualityStatus === 'RECHAZADO') {
          alerts.push({
            level: 'danger',
            code: 'RECHAZO',
            title: `Lote ${l.id} RECHAZADO por Calidad`,
            desc: `${l.producerName} — Bloqueado para proceso de exportación.`
          });
        }
      });

      // Pallets bloqueados en cámara
      appState.pallets.forEach(p => {
        if (p.status === 'BLOQUEADO') {
          alerts.push({
            level: 'danger',
            code: 'BLOQUEO',
            title: `Pallet ${p.id} bloqueado en ${p.chamber}`,
            desc: p.blockReason || 'Bloqueo preventivo activo (HU-12).'
          });
        }
      });

      // Stock crítico de insumos
      appState.supplies.forEach(s => {
        if (s.stock <= s.minStock) {
          alerts.push({
            level: 'warning',
            code: 'BODEGA',
            title: `Stock crítico: ${s.name}`,
            desc: `Quedan ${s.stock} ${s.unit} (mínimo operacional: ${s.minStock}).`
          });
        }
      });

      return alerts;
    }

    function updateAlertsBadge() {
      const alerts = computeOperationalAlerts();
      const badge = document.getElementById('alerts-badge');
      if (!badge) return;
      if (alerts.length > 0) {
        badge.textContent = alerts.length;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    function updateOfflineBanner() {
      const banner = document.getElementById('network-banner');
      const badge = document.getElementById('offline-queue-badge');
      if (appState.offlineMode) {
        banner.classList.remove('hidden');
        badge.textContent = `${appState.offlineQueue.length} pendientes`;
      } else {
        banner.classList.add('hidden');
      }
    }

      appState.currentRole = role;

        showToast('El lote seleccionado no está habilitado para proceso.', 'error');
        return;
      }
      const nextNum = String(appState.processOrders.length + 1).padStart(3, '0');
      const newOrder = {
        id: `OP-2026-${nextNum}`,
        lotId: lot.id,
        producerName: lot.producerName,
        exporter: lot.exporter,
        variety: lot.variety,
        inputWeightKg: lot.netWeightKg,
        packagingName: document.getElementById('po-packaging').value,
        line: document.getElementById('po-line').value,
        targetMarket: document.getElementById('po-market').value,
        status: 'EN PROCESO',

        closedAt: null,
        exportedKg: 0,
        discardKg: 0,
        shrinkageKg: 0,
        yieldPct: 0
      };
      lot.processOrderId = newOrder.id;
      appState.processOrders.unshift(newOrder);
      logAudit(`Emitió Orden de Proceso ${newOrder.id} para el lote ${lot.id} (${lot.netWeightKg} kg).`);

      renderWorkspace();
      renderAuditLog();

    function recalcMassBalance() {
      const orderId = document.getElementById('bal-order-id')?.value;
      const order = appState.processOrders.find(o => o.id === orderId);
      const exp = Number(document.getElementById('bal-exported')?.value || 0);
      const disc = Number(document.getElementById('bal-discard')?.value || 0);
      const preview = document.getElementById('bal-preview');
      if (!order || !preview) return;
      const shrink = order.inputWeightKg - exp - disc;
      const yieldPct = order.inputWeightKg > 0 ? ((exp / order.inputWeightKg) * 100).toFixed(2) : '0.00';
      preview.innerHTML = `
        <div class="flex justify-between"><span>Materia Prima Entrada:</span><strong>${order.inputWeightKg.toLocaleString('es-CL')} kg</strong></div>
        <div class="flex justify-between"><span>Merma Calculada (Deshidratación/Descarte técnico):</span><strong class="${shrink < 0 ? 'text-red-600' : 'text-gray-900'}">${shrink.toLocaleString('es-CL')} kg</strong></div>
        <div class="flex justify-between pt-1 border-t border-forest-200 text-base"><span>Rendimiento Exportable:</span><strong class="text-forest-800">${yieldPct}%</strong></div>
      `;
    }

    function handleCloseProcessOrder(e) {
      e.preventDefault();
      const orderId = document.getElementById('bal-order-id').value;
      const order = appState.processOrders.find(o => o.id === orderId);
      const exp = Number(document.getElementById('bal-exported').value);
      const disc = Number(document.getElementById('bal-discard').value);
      if (!order) return;
      if (exp + disc > order.inputWeightKg) {
        showToast('La suma de exportación y descarte supera los kilos de entrada.', 'error');
        return;
      }
      order.exportedKg = exp;
      order.discardKg = disc;
      order.shrinkageKg = order.inputWeightKg - exp - disc;
      order.yieldPct = Number(((exp / order.inputWeightKg) * 100).toFixed(2));
      order.status = 'CERRADA';
      order.closedAt = new Date().toISOString().slice(0, 16).replace('T', ' ');

      // Descuento automático proporcional de insumos en Bodega (HU-14)
      const estimatedBoxes = Math.ceil(exp / 5);
      const boxSupply = appState.supplies.find(s => s.id === 'INS-01');
      if (boxSupply) boxSupply.stock = Math.max(0, boxSupply.stock - estimatedBoxes);

      logAudit(`Cerró orden ${order.id} (Rendimiento ${order.yieldPct}%) y descontó ${estimatedBoxes} cajas en Bodega.`);
      saveState();
      renderWorkspace();
      renderAuditLog();
      showToast(`Orden ${order.id} cerrada. Balance de masas actualizado.`);
    }

    function handleCreateDispatchOrder(e) {
      e.preventDefault();
      const exporter = document.getElementById('disp-exporter').value;
      const destination = document.getElementById('disp-destination').value.trim();
      const transport = document.getElementById('disp-transport').value.trim();
      const checkedBoxes = Array.from(document.querySelectorAll('input[name="disp-pallet"]:checked'));
      const selectedIds = checkedBoxes.map(cb => cb.value);

      if (selectedIds.length === 0) {
        showToast('Debe seleccionar al menos 1 pallet libre y activo para liberar la instrucción.', 'error');
        return;
      }

      // Doble validación en memoria para impedir duplicación o inclusión de bloqueados
      for (const pid of selectedIds) {
        const palletObj = appState.pallets.find(p => p.id === pid);
        if (!palletObj || palletObj.status !== 'ACTIVO') {
          showToast(`El pallet ${pid} está bloqueado o no disponible.`, 'error');
          return;
        }
        const alreadyAssigned = getAssignedOrderForPallet(pid);
        if (alreadyAssigned) {
          showToast(`El pallet ${pid} ya fue asignado a la Orden #${alreadyAssigned.id}.`, 'error');
          return;
        }
      }

      const nextId = String(501 + appState.dispatchOrders.length);
      const newOrder = {
        id: nextId,
        exporter,
        destination,
        transport,
        palletIds: selectedIds,
        validatedPallets: [],
        status: 'LIBERADA A ANDÉN',
        createdAt: new Date().toISOString().slice(0, 16).replace('T', ' '),
        dispatchedAt: null
      };

      appState.dispatchOrders.unshift(newOrder);
      logAudit(`Liberó Orden de Embarque #${nextId} para ${exporter} con ${selectedIds.length} pallet(s): ${selectedIds.join(', ')}.`);
      saveState();
      renderWorkspace();
      renderAuditLog();
      showToast(`Orden de Embarque #${nextId} liberada a andén. Pallets bloqueados contra duplicación.`);
    }

    function confirmSupervisedReprint(e, palletId) {
      e.preventDefault();
      const pin = document.getElementById('rep-pin').value;
      const reason = document.getElementById('rep-reason').value.trim();
      if (pin !== SUPERVISOR_PIN) {
        showToast('Clave supervisora incorrecta.', 'error');
        return;
      }
      const p = appState.pallets.find(x => x.id === palletId);
      if (p) {
        p.reprintCount += 1;
        logAudit(`Reimprimió etiqueta ${palletId} (Anulada emisión previa). Motivo: ${reason}.`);
        saveState();
        closeModal();
        renderWorkspace();
        renderAuditLog();
        showToast(`Etiqueta ${palletId} reimpresa bajo autorización supervisora.`);
      }
    }

        supply.stock = Math.max(0, supply.stock + delta);
        logAudit(`Ajustó stock en turno abierto (${supply.name}: ${delta > 0 ? '+' : ''}${delta} ${supply.unit}).`);
        saveState();
        renderWorkspace();
        renderAuditLog();
        showToast(`Stock actualizado: ${supply.name} (${supply.stock} ${supply.unit}).`);
        return;

      appState.offlineMode = !appState.offlineMode;
      if (!appState.offlineMode && appState.offlineQueue.length > 0) {
        const count = appState.offlineQueue.length;
        appState.offlineQueue.forEach(item => {
          const p = appState.pallets.find(x => x.id === item.palletId);
          if (p) p.chamber = item.location;
        });
        appState.offlineQueue = [];
        logAudit(`Sincronizó ${count} movimiento(s) de cámara almacenados en cola offline SQLite.`);
        showToast(`Conexión restablecida: ${count} lectura(s) sincronizadas sin pérdida de datos.`);
      } else if (appState.offlineMode) {
        showToast('Corte de Wi-Fi simulado en cámara. Modo offline activo.', 'warning');
      }
      saveState();
      renderApp();
    }

        renderWorkspace();

    function playDockAlarmBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, ctx.currentTime);
        gain.gain.setValueAtTime(0.25, ctx.currentTime);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.45);
      } catch (e) {}
    }

    function scanPalletAtDock(orderId, palletId) {
      const ord = appState.dispatchOrders.find(o => o.id === orderId);
      const p = appState.pallets.find(x => x.id === palletId);
      if (!ord || !p) return;

      if (p.status === 'BLOQUEADO') {
        playDockAlarmBeep();
        openModal(`
          <div class="p-6 bg-red-700 text-white space-y-4">
            <h3 class="text-xl font-extrabold">🚨 ALERTA DE BLOQUEO EN ANDÉN (HU-13)</h3>
            <p class="text-sm">El pallet <strong>${p.id}</strong> tiene un bloqueo preventivo activo: <em>"${p.blockReason}"</em>.</p>
            <p class="text-xs opacity-90">Carga detenida por sistema. Levante el bloqueo desde Cámaras de Frío antes de embarcar.</p>
            <button onclick="closeModal()" class="w-full py-3 rounded-xl bg-white text-red-800 font-extrabold text-sm">Entendido · Detener Carga</button>
          </div>
        `);
        return;
      }

      if (!ord.validatedPallets.includes(palletId)) {
        ord.validatedPallets.push(palletId);
        logAudit(`Validó escaneo de pallet ${palletId} en andén para Orden #${orderId}.`);
        saveState();
        renderWorkspace();
        renderAuditLog();
        showToast(`Pallet ${palletId} validado correctamente en contenedor.`);
      }
    }

    function finalizeDispatchShipment(orderId) {
      const ord = appState.dispatchOrders.find(o => o.id === orderId);
      if (!ord) return;
      ord.status = 'EMBARCADO';
      ord.dispatchedAt = new Date().toISOString().slice(0, 16).replace('T', ' ');
      ord.palletIds.forEach(pid => {
        const p = appState.pallets.find(x => x.id === pid);
        if (p) {
          p.status = 'EMBARCADO';
          p.chamber = `Despachado (Orden #${ord.id})`;
        }
      });
      logAudit(`Cerró embarque Orden #${ord.id} (${ord.exporter}) y emitió Guía de Despacho Electrónica.`);
      saveState();
      renderWorkspace();
      renderAuditLog();
      showToast(`Embarque #${ord.id} cerrado. Pallets descontados de cámara.`);
    }

            <div class="bg-white p-5 rounded-2xl border border-gray-200 shadow-sm">
              <span class="text-xs font-bold uppercase text-gray-500">Órdenes de Embarque</span>
              <p class="text-3xl font-extrabold text-forest-900 mt-1">${myOrders.length}</p>
            </div>
          </div>

          <div class="bg-white rounded-2xl border border-gray-200 p-5 sm:p-6 shadow-sm space-y-4">
            <h2 class="text-lg font-extrabold text-gray-900">Lotes y Certificados Fitosanitarios · ${exporterName}</h2>
            <div class="space-y-3">
              ${myLots.map(l => `
                <div class="p-4 rounded-xl border border-gray-200 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                  <div>
                    <span class="font-mono font-bold text-sm text-forest-900">${l.id} · ${l.variety}</span>
                    <p class="text-xs text-gray-600">Productor: ${l.producerName} (${l.csg}) · ${l.netWeightKg.toLocaleString('es-CL')} kg</p>
                  </div>
                  <span class="px-3 py-1 rounded-full text-xs font-bold ${l.qualityStatus === 'ACEPTADO' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">
                    Calidad: ${l.qualityStatus}
                  </span>
                </div>
              `).join('') || '<p class="text-sm text-gray-500">No hay lotes registrados para este exportador.</p>'}
            </div>
          </div>

          <div class="bg-white rounded-2xl border border-gray-200 p-5 sm:p-6 shadow-sm space-y-4">
            <h2 class="text-lg font-extrabold text-gray-900">Pallets en Cámara y Embarques · ${exporterName}</h2>
            <div class="space-y-3">
              ${myPallets.map(p => `
                <div class="p-4 rounded-xl border border-gray-200 flex items-center justify-between">
                  <div>
                    <span class="font-mono font-bold text-sm">${p.id} · ${p.variety}</span>
                    <p class="text-xs text-gray-600">${p.boxes} cajas (${p.netWeightKg} kg) · Ubicación: ${p.chamber}</p>
                  </div>
                  <span class="px-2.5 py-1 rounded-full text-xs font-bold bg-forest-50 text-forest-800">${p.status}</span>
                </div>
              `).join('') || '<p class="text-sm text-gray-500">No hay pallets asociados a este exportador.</p>'}
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 10. MODALES TRANSVERSALES (CATÁLOGOS, REINICIO 1234, ALERTAS, BUSCADOR)
    // =========================================================================
    function openModal(htmlContent) {
      const backdrop = document.getElementById('modal-backdrop');
      const box = document.getElementById('modal-box');
      box.innerHTML = htmlContent;
      backdrop.classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal-backdrop').classList.add('hidden');
    }

    function openResetSystemModal() {
      openModal(`
        <form onsubmit="confirmSystemReset(event)" class="p-6 space-y-4">
          <div class="flex items-center justify-between border-b pb-3">
            <h3 class="font-extrabold text-lg text-red-700">Reiniciar Sistema Operativo</h3>
            <button type="button" onclick="closeModal()" class="text-gray-400 hover:text-gray-700 font-bold">✕</button>
          </div>
          <p class="text-xs sm:text-sm text-gray-600">
            Esta acción limpiará todos los lotes, órdenes de proceso, pallets y despachos en localStorage, restaurando los catálogos maestros base y el stock estándar de bodega.
          </p>
          <div>
            <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Contraseña de Autorización (1234) *</label>
            <input id="reset-pin-input" type="password" required placeholder="Ingrese 1234"
              class="w-full h-11 px-3.5 rounded-xl border border-gray-300 font-mono text-sm" />
          </div>
          <div class="flex justify-end gap-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl bg-gray-100 text-gray-800 text-sm font-bold">Cancelar</button>
            <button type="submit" class="px-4 py-2.5 rounded-xl bg-red-600 hover:bg-red-700 text-white text-sm font-bold">Confirmar Reinicio</button>
          </div>
        </form>
      `);
    }

    function confirmSystemReset(e) {
      e.preventDefault();
      const pin = document.getElementById('reset-pin-input').value;
      if (pin !== SUPERVISOR_PIN) {
        showToast('Contraseña incorrecta. No se reinició el sistema.', 'error');
        return;
      }
      localStorage.removeItem(STORAGE_KEY);
      const base = getCleanInitialState();
      // Dejar operación limpia en 0 con catálogos maestros y stock estándar
      base.lots = [];
      base.processOrders = [];
      base.pallets = [];
      base.dispatchOrders = [];
      base.auditLogs = [
        { time: new Date().toTimeString().slice(0, 5), user: 'Carlos Muñoz', role: 'Jefe de Planta', action: 'Reinició el sistema operativo dejando catálogos maestros y stock estándar listos para pruebas.' }
      ];
      appState = base;
      saveState();
      closeModal();
      renderApp();
      showToast('Sistema reiniciado correctamente. Listo para iniciar flujo desde Recepción.');
    }

    function openCatalogsModal() {
      openModal(`
        <div class="p-6 space-y-5 max-h-[85vh] overflow-y-auto">
          <div class="flex items-center justify-between border-b pb-3">
            <h3 class="font-extrabold text-lg text-gray-900">Catálogos Maestros · FrutalSur</h3>
            <button onclick="closeModal()" class="text-gray-400 hover:text-gray-700 font-bold">✕</button>
          </div>

          <form onsubmit="addNewProducer(event)" class="p-4 rounded-xl bg-forest-50 border border-forest-200 space-y-3">
            <h4 class="text-xs font-extrabold uppercase text-forest-800">+ Agregar Nuevo Productor / Predio</h4>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
              <input id="cat-prod-name" type="text" required placeholder="Nombre Agrícola" class="h-10 px-3 rounded-lg border border-gray-300 text-xs font-semibold bg-white" />
              <input id="cat-prod-csg" type="text" required placeholder="Código CSG" class="h-10 px-3 rounded-lg border border-gray-300 text-xs font-mono bg-white" />
              <select id="cat-prod-exp" class="h-10 px-3 rounded-lg border border-gray-300 text-xs font-semibold bg-white">
                <option>Valle Sur S.A.</option>
                <option>Andes Export Ltda.</option>
              </select>
            </div>
            <button type="submit" class="px-4 py-2 rounded-lg bg-forest-800 text-white text-xs font-bold">Guardar Productor</button>
          </form>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
            <div class="border rounded-xl p-3.5">
              <h4 class="font-extrabold text-gray-800 mb-2">Productores (${appState.catalogs.producers.length})</h4>
              <ul class="space-y-1 text-gray-600">
                ${appState.catalogs.producers.map(p => `<li>• <strong>${p.name}</strong> (${p.csg}) — ${p.exporter}</li>`).join('')}
              </ul>
            </div>
            <div class="border rounded-xl p-3.5">
              <h4 class="font-extrabold text-gray-800 mb-2">Especies / Variedades (${appState.catalogs.varieties.length})</h4>
              <ul class="space-y-1 text-gray-600">
                ${appState.catalogs.varieties.map(v => `<li>• <strong>${v.species} ${v.variety}</strong> (${v.tempReq})</li>`).join('')}
              </ul>
            </div>
          </div>
        </div>
      `);
    }

    function addNewProducer(e) {
      e.preventDefault();
      const name = document.getElementById('cat-prod-name').value.trim();
      const csg = document.getElementById('cat-prod-csg').value.trim();
      const exporter = document.getElementById('cat-prod-exp').value;
      appState.catalogs.producers.push({
        id: `PROD-0${appState.catalogs.producers.length + 1}`,
        name,
        csg,
        region: 'O’Higgins',
        exporter
      });
      logAudit(`Registró nuevo productor en catálogo maestro: ${name} (${csg}).`);
      saveState();
      openCatalogsModal();
      renderAuditLog();
      showToast(`Productor ${name} añadido al catálogo.`);
    }

    function openAlertsDrawer() {
      const alerts = computeOperationalAlerts();
      openModal(`
        <div class="p-6 space-y-4">
          <div class="flex items-center justify-between border-b pb-3">
            <h3 class="font-extrabold text-lg text-gray-900">Alertas Operacionales Activas (${alerts.length})</h3>
            <button onclick="closeModal()" class="text-gray-400 hover:text-gray-700 font-bold">✕</button>
          </div>
          ${alerts.length === 0 ? `
            <p class="text-sm text-emerald-800 bg-emerald-50 p-4 rounded-xl border border-emerald-200 font-semibold">
              ✓ Operación normal. No existen alertas críticas pendientes.
            </p>
          ` : `
            <div class="space-y-2.5 max-h-80 overflow-y-auto">
              ${alerts.map(a => `
                <div class="p-3.5 rounded-xl border ${a.level === 'danger' ? 'bg-red-50 border-red-200 text-red-900' : 'bg-amber-50 border-amber-200 text-amber-950'}">
                  <span class="text-[10px] font-extrabold uppercase tracking-wider">${a.code}</span>
                  <p class="font-bold text-sm">${a.title}</p>
                  <p class="text-xs mt-0.5">${a.desc}</p>
                </div>
              `).join('')}
            </div>
          `}
        </div>
      `);
    }

    function openQuickTraceModal() {
      if (appState.currentRole !== 'jefe' && appState.currentRole !== 'recepcion') return;
      openModal(`
        <div class="p-6 space-y-4">
          <div class="flex items-center justify-between border-b pb-3">
            <h3 class="font-extrabold text-lg text-gray-900">Búsqueda Rápida de Trazabilidad (HU-19)</h3>
            <button onclick="closeModal()" class="text-gray-400 hover:text-gray-700 font-bold">✕</button>
          </div>
          <input type="text" placeholder="Escriba ID de Lote, Orden o Pallet..."
            onkeyup="document.getElementById('modal-trace-out').innerHTML = buildTraceabilityHtml(this.value)"
            class="w-full h-11 px-4 rounded-xl border border-gray-300 font-mono text-sm" autofocus />
          <div id="modal-trace-out">
            ${buildTraceabilityHtml(appState.lots[0]?.id || '')}
          </div>
        </div>
      `);
    }

    function openLoginModal() {
      openModal(`
        <div class="p-6 space-y-4">
          <div class="flex items-center justify-between border-b pb-3">
            <h3 class="font-extrabold text-lg text-gray-900">Control de Acceso por Perfil (RBAC)</h3>
            <button onclick="closeModal()" class="text-gray-400 hover:text-gray-700 font-bold">✕</button>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
            ${[
              ['jefe', 'Carlos Muñoz', 'Jefe de Planta'],
              ['recepcion', 'Osvaldo Ruiz', 'Recepción y Empaque'],
              ['calidad', 'Camila Valdés', 'Control de Calidad'],
              ['bodega', 'Marcelo Rojas', 'Bodega de Insumos'],
              ['frigorifico', 'Enrique Valenzuela', 'Frigorífico y Andén'],
              ['client_vallesur', 'Valle Sur S.A.', 'Portal Exportador (RLS)'],
              ['client_andes', 'Andes Export Ltda.', 'Portal Exportador (RLS)']
            ].map(([id, name, role]) => `
              <button onclick="switchRole('${id}'); closeModal();"
                class="p-3.5 rounded-xl border ${appState.currentRole === id ? 'border-forest-800 bg-forest-50' : 'border-gray-200 hover:bg-gray-50'} text-left transition">
                <p class="font-bold text-sm text-gray-900">${name}</p>
                <p class="text-xs text-gray-500">${role}</p>
              </button>
            `).join('')}
          </div>
        </div>
      `);
    }

    function renderAuditLog() {
      const list = document.getElementById('audit-log-list');
      const count = document.getElementById('audit-count');
      if (!list) return;
      count.textContent = `${appState.auditLogs.length} eventos`;
      list.innerHTML = appState.auditLogs.map(item => `
        <div class="px-4 sm:px-6 py-2.5 flex items-start sm:items-center justify-between gap-3 hover:bg-gray-50">
          <div class="flex items-start sm:items-center gap-2.5">
            <span class="font-mono text-xs text-gray-400 shrink-0">${item.time}</span>
            <span class="px-2 py-0.5 rounded bg-forest-50 text-forest-800 font-bold text-[11px] shrink-0">${item.user}</span>
            <span class="text-gray-700">${item.action}</span>
          </div>
        </div>
      `).join('');
    }

    // Inicialización al cargar DOM
    window.addEventListener('DOMContentLoaded', () => {
      renderApp();
    });
  </script>
</body>
</html>
