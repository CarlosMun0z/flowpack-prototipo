    /* ==========================================================================

    function formatTimeNow() {
      const d = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }

    function formatDateTimeNow() {
      const d = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${formatTimeNow()}`;
    }

    function formatKg(value) {
      return Number(value).toLocaleString('es-CL');
    }

    function getActiveProfile() {
      return USER_PROFILES.find((p) => p.id === appState.activeProfileId) || USER_PROFILES[0];
    }

    function addAuditRecord(user, moduleName, eventName, detail, level = 'info') {
      appState.auditLogs.unshift({
        time: formatTimeNow(),
        user,
        module: moduleName,
        event: eventName,
        detail,
        level,
      });
    }

    function showNotification(title, message, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const palette = {
        success: 'bg-emerald-900 border-emerald-400 text-white',
        danger: 'bg-red-900 border-red-400 text-white',
        warning: 'bg-amber-900 border-amber-400 text-white',
        info: 'bg-slate-900 border-sky-400 text-white',
      };

      const card = document.createElement('div');
      card.className = `pointer-events-auto p-4 rounded-xl border-l-8 shadow-2xl transition-all duration-200 ${palette[type] || palette.info}`;
      card.innerHTML = `
        <div class="flex items-start justify-between gap-3">
          <div>
            <p class="font-black text-sm uppercase tracking-wide">${title}</p>
            <p class="text-xs sm:text-sm text-slate-100 mt-1 font-medium">${message}</p>
          </div>
          <button onclick="this.parentElement.parentElement.remove()" class="px-2 py-1 rounded bg-white/15 hover:bg-white/25 text-xs font-black">
            ✕
          </button>
        </div>
      `;
      container.appendChild(card);

      setTimeout(() => {
        if (card.parentElement) card.remove();
      }, 4500);
    }

    /**
     * Genera un Código QR determinístico en SVG puro para etiquetas térmicas 10x15 cm
     */
    function buildQrCodeSvg(dataString, sizePx = 164) {
      const modules = 21;
      const cell = sizePx / modules;
      let hash = 2166136261;
      for (let i = 0; i < dataString.length; i++) {
        hash ^= dataString.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }

      const isFinder = (r, c) =>
        (r < 7 && c < 7) || (r < 7 && c >= modules - 7) || (r >= modules - 7 && c < 7);

      const finderSolid = (r, c) => {
        const lr = r < 7 ? r : r - (modules - 7);
        const lc = c < 7 ? c : c - (modules - 7);
        return lr === 0 || lr === 6 || lc === 0 || lc === 6 || (lr >= 2 && lr <= 4 && lc >= 2 && lc <= 4);
      };

      let svgBody = `<rect width="${sizePx}" height="${sizePx}" fill="#ffffff"/>`;
      for (let r = 0; r < modules; r++) {
        for (let c = 0; c < modules; c++) {
          let dark = false;
          if (isFinder(r, c)) {
            dark = finderSolid(r, c);
          } else if (r === 6 || c === 6) {
            dark = (r + c) % 2 === 0;
          } else {
            const bit = Math.abs(Math.imul(hash ^ (r * 37 + c * 13), 2654435761));
            dark = bit % 100 < 48;
          }
          if (dark) {
            svgBody += `<rect x="${(c * cell).toFixed(2)}" y="${(r * cell).toFixed(2)}" width="${(cell + 0.25).toFixed(2)}" height="${(cell + 0.25).toFixed(2)}" fill="#0f172a"/>`;
          }
        }
      }

      return `<svg width="${sizePx}" height="${sizePx}" viewBox="0 0 ${sizePx} ${sizePx}" xmlns="http://www.w3.org/2000/svg" class="border-2 border-slate-950 bg-white">${svgBody}</svg>`;
    }

    function handleLoginSubmit(event) {
      event.preventDefault();
      const email = document.getElementById('login-email').value.trim().toLowerCase();
      const pass = document.getElementById('login-password').value.trim();

      appState.loginEmailInput = email;
      appState.loginPasswordInput = pass;

      const matchedProfile = USER_PROFILES.find((p) => p.email.toLowerCase() === email);
      if (!matchedProfile || !pass) {
        appState.loginError = 'Credenciales no reconocidas. Seleccione un perfil válido en el panel inferior o verifique su correo corporativo.';
        render();
        return;
      }

      appState.loginError = '';
      appState.activeProfileId = matchedProfile.id;
      appState.isAuthenticated = true;

      addAuditRecord(
        matchedProfile.name,
        'CONTROL ACCESO',
        'INICIO DE SESIÓN',
        `Acceso autenticado como ${matchedProfile.roleTitle} (${matchedProfile.email}).`,
        'info'
      );

      showNotification(
        `Bienvenido, ${matchedProfile.name}`,
        `Sesión iniciada en modo: ${matchedProfile.roleTitle}.`,
        'success'
      );

      render();
    }

    function quickLoginWithProfile(profileId) {
      const profile = USER_PROFILES.find((p) => p.id === profileId);
      if (!profile) return;

      appState.loginEmailInput = profile.email;
      appState.loginPasswordInput = profile.passwordHint;
      appState.loginError = '';
      appState.activeProfileId = profile.id;
      appState.isAuthenticated = true;

      addAuditRecord(
        profile.name,
        'CONTROL ACCESO',
        'INICIO DE SESIÓN',
        `Acceso directo con credenciales de planta: ${profile.roleTitle}.`,
        'info'
      );

      showNotification(
        `Sesión Activa: ${profile.name}`,
        `${profile.roleTitle} — ${profile.area}.`,
        'success'
      );

      render();
    }

    function handleCreateProcessOrder(event) {
      event.preventDefault();
      const lot = appState.receptions.find((r) => r.id === appState.ui.adminSelectedLotId);
      if (!lot) return;

      // Validación estricta de bloqueo fitosanitario
      if (lot.status !== 'ACEPTADO') {
        addAuditRecord(
          'Carlos Muñoz',
          'PLANIFICACIÓN',
          'BLOQUEO DE SEGURIDAD',
          `Intento impedido de procesar lote ${lot.id} en estado ${lot.status} (${lot.reason}).`,
          'danger'
        );
        showNotification(
          'OPERACIÓN BLOQUEADA POR SEGURIDAD',
          `El lote ${lot.id} está en estado ${lot.status}. Motivo: ${lot.reason}`,
          'danger'
        );
        return;
      }

      const line = document.getElementById('admin-line-select').value;
      const boxFormat = document.getElementById('admin-box-select').value;
      const nextNum = String(appState.processOrders.length + 1).padStart(3, '0');
      const newOrderId = `OP-2026-${nextNum}`;
      const estimatedBoxes = Math.round(lot.weightKg / 5);

      appState.processOrders.unshift({
        id: newOrderId,
        lotId: lot.id,
        producer: lot.producer,
        exporter: lot.exporter,
        variety: lot.variety,
        line,
        boxFormat,
        estimatedBoxes,
        weightKg: lot.weightKg,
        status: 'EN PROCESO',
        createdBy: 'Carlos Muñoz',
        createdAt: formatDateTimeNow(),
      });

      addAuditRecord(
        'Carlos Muñoz',
        'PLANIFICACIÓN',
        'ORDEN CREADA',
        `${newOrderId} generada para lote aprobado ${lot.id} (${estimatedBoxes} cajas • ${line}).`,
        'success'
      );

      showNotification(
        `Orden ${newOrderId} Emitida`,
        `Habilitada en Línea de Empaque y stock comprometido actualizado en Bodega de Insumos.`,
        'success'
      );

      render();
    }

    function handleAddProducer(event) {
      event.preventDefault();
      const nameInput = document.getElementById('cat-producer-name');
      const exporterSelect = document.getElementById('cat-producer-exporter');
      const name = nameInput.value.trim();
      const exporter = exporterSelect.value;

      if (!name) {
        showNotification('Dato Requerido', 'Ingrese el nombre comercial del productor.', 'warning');
        return;
      }

      if (appState.catalogs.producers.some((p) => p.name.toLowerCase() === name.toLowerCase())) {
        showNotification('Registro Existente', `El productor "${name}" ya está registrado en el maestro.`, 'warning');
        return;
      }

      appState.catalogs.producers.push({ name, exporter });
      addAuditRecord(
        'Carlos Muñoz',
        'CATÁLOGOS',
        'ALTA PRODUCTOR',
        `Productor "${name}" vinculado a ${exporter} agregado al catálogo maestro.`,
        'info'
      );
      showNotification('Productor Agregado', `"${name}" (${exporter}) ya está disponible en Recepción.`, 'success');
      render();
    }

      addAuditRecord(
        'Camila Valdés',

    function handleIssueQualityVerdict(verdict) {
      const lot = appState.receptions.find((r) => r.id === appState.ui.qualitySelectedLotId);
      if (!lot) return;

      const brix = parseFloat(document.getElementById('qc-brix').value) || 0;
      const firmness = parseInt(document.getElementById('qc-firmness').value, 10) || 0;
      const defectsPct = parseFloat(document.getElementById('qc-defects').value) || 0;
      const reason = document.getElementById('qc-justification').value.trim();
      const errorBanner = document.getElementById('qc-error-banner');

      if (!reason) {
        errorBanner.classList.remove('hidden');
        document.getElementById('qc-justification').focus();
        showNotification(
          'Justificación Obligatoria',
          'Debe ingresar el detalle técnico del dictamen fitosanitario antes de confirmar.',
          'danger'
        );
        return;
      }

      errorBanner.classList.add('hidden');

      lot.status = verdict;
      lot.reason = reason;
      lot.quality = {
        brix,
        firmness,
        defectsPct,
        photoCaptured: appState.ui.qualityPhotoCaptured,
        photoTimestamp: appState.ui.qualityPhotoTimestamp || formatDateTimeNow(),
        inspector: 'Camila Valdés',
      };

      const isBlocked = verdict === 'RECHAZADO' || verdict === 'OBSERVADO';

      addAuditRecord(
        'Camila Valdés',
        'CONTROL CALIDAD',
        `DICTAMEN ${verdict}`,
        `${lot.id} (${lot.producer}) -> ${verdict}. °Brix: ${brix}, Firmeza: ${firmness}, Defectos: ${defectsPct}%. Motivo: ${reason}`,
        isBlocked ? 'danger' : 'success'
      );

      showNotification(
        `Dictamen Emitido: ${lot.id} -> ${verdict}`,
        isBlocked
          ? 'Bloqueo preventivo propagado inmediatamente a Planificación y Línea de Empaque.'
          : 'Lote aprobado y habilitado de inmediato para Órdenes de Proceso y Etiquetado QR.',
        isBlocked ? 'danger' : 'success'
      );

      render();
    }

    function handleGeneratePalletLabel(event) {
      event.preventDefault();
      const lotSelect = document.getElementById('op-accepted-lot-select');
      if (!lotSelect || !lotSelect.value) {
        showNotification('Sin Lote Aceptado', 'Seleccione un lote en estado ACEPTADO para paletizar.', 'warning');

      }

      const lot = appState.receptions.find((r) => r.id === lotSelect.value);

        showNotification('Lote No Habilitado', 'Solo se permite emitir etiquetas QR para lotes ACEPTADOS.', 'danger');

      const boxes = parseInt(document.getElementById('op-pallet-boxes-input').value, 10) || 80;

      const unitKg = boxFormat.includes('2.5') ? 2.5 : boxFormat.includes('1.5') ? 1.5 : 5;
      const netWeightKg = Math.round(boxes * unitKg);

      const nextPalletSeq = 841 + appState.pallets.length;
      const newPalletId = `PLT-2026-0${nextPalletSeq}`;

      appState.pallets.unshift({
        id: newPalletId,
        lotId: lot.id,
        producer: lot.producer,
        exporter: lot.exporter,
        variety: lot.variety,
        boxFormat,
        boxes,
        netWeightKg,
        location: 'Andén de Empaque (Pendiente Cámara)',

        showNotification(

    function selectPdaRackLocation(rackName) {

    function handlePdaAssignPalletLocation() {
      const selectEl = document.getElementById('pda-pallet-dropdown');
      const palletId = selectEl ? selectEl.value : appState.ui.pdaSelectedPalletId;
      const rackLocation = appState.ui.pdaSelectedRack;
      const pallet = appState.pallets.find((p) => p.id === palletId);

      if (!pallet) return;
      appState.ui.pdaSelectedPalletId = palletId;

      if (appState.isOnline) {
        pallet.location = rackLocation;
        pallet.syncState = 'SINCRONIZADO';

        addAuditRecord(
          'Enrique Valenzuela',
          'FRIGORÍFICO PDA',
          'UBICACIÓN REGISTRADA',
          `${palletId} asignado a ${rackLocation} directamente en Servidor Central.`,
          'success'
        );

        showNotification(
          `Pallet ${palletId} Ubicado`,
          `Registrado en ${rackLocation} (Servidor Central actualizado).`,
          'success'
        );
      } else {
        const localId = `LOC-${String(appState.sqliteQueue.length + 1).padStart(4, '0')}`;
        appState.sqliteQueue.push({
          localId,
          palletId,
          rackLocation,
          timestamp: formatDateTimeNow(),
        });

        pallet.location = `${rackLocation} (En Cola SQLite)`;
        pallet.syncState = 'PENDIENTE SQLITE';

        addAuditRecord(
          'Enrique Valenzuela',
          'SQLITE LOCAL (-2°C)',
          'REGISTRO OFFLINE',
          `${localId}: ${palletId} -> ${rackLocation} guardado en cola local (${appState.sqliteQueue.length}/10.000).`,
          'warning'
        );

        showNotification(
          `Guardado en Cola Local SQLite (${localId})`,
          `${palletId} -> ${rackLocation}. Pendiente de sincronización (${appState.sqliteQueue.length}/10.000).`,
          'warning'
        );
      }

      render();
    }

    function syncSqliteWithCentralServer() {
      if (!appState.isOnline) {
        showNotification(
          'Sin Conexión Wi-Fi',
          'Active la conexión "CONECTADO (Wi-Fi Planta)" para sincronizar los registros locales.',
          'danger'
        );
        return;
      }

      if (appState.sqliteQueue.length === 0 || appState.isSyncing) return;

      appState.isSyncing = true;
      appState.syncProgress = 20;
      render();

      const pendingCount = appState.sqliteQueue.length;

      setTimeout(() => {
        appState.syncProgress = 68;
        render();
      }, 450);

      setTimeout(() => {
        appState.sqliteQueue.forEach((item) => {
          const p = appState.pallets.find((pal) => pal.id === item.palletId);
          if (p) {
            p.location = item.rackLocation;
            p.syncState = 'SINCRONIZADO';
          }
        });

        appState.sqliteQueue = [];
        appState.isSyncing = false;
        appState.syncProgress = 100;

        addAuditRecord(
          'Enrique Valenzuela',
          'SINCRONIZACIÓN',
          'COLA SQLITE VACIADA',
          `${pendingCount} registro(s) sincronizados con Servidor Central en 1.2 segundos.`,
          'success'
        );

        showNotification(
          'Sincronización Completada (1.2s)',
          `${pendingCount} registro(s) consolidados en Servidor Central. Cola local SQLite en 0.`,
          'success'
        );

        render();
      }, 1200);
    }

    /* ==========================================================================
       VISTA PERFIL 5: ENCARGADO DE BODEGA DE INSUMOS (MARCELO ROJAS)
       ========================================================================== */

    function renderWarehouseWorkspace() {
      const profile = getActiveProfile();

      // Consumo comprometido dinámico vinculado a las Órdenes de Proceso activas
      const totalBoxesOrdered = appState.processOrders.reduce((sum, op) => sum + op.estimatedBoxes, 0);
      const extraOrdersCount = Math.max(0, appState.processOrders.length - 1);

      const computedMaterials = appState.warehouseStock.map((item) => {
        let committed = item.baseCommitted;
        if (item.code === 'INS-CAJ-05' || item.code === 'INS-BOL-MAP') {
          committed = totalBoxesOrdered;
        } else if (item.code === 'INS-ETQ-QR') {
          committed = item.baseCommitted + extraOrdersCount * 3;
        } else if (item.code === 'INS-PLT-NIMF') {
          committed = Math.ceil(totalBoxesOrdered / 80) + 3;
        }

        const available = item.physicalStock - committed;
        const isCritical = available <= 0;
        const isLow = available > 0 && available <= item.minThreshold;

        return {
          ...item,
          committed,
          available,
          isCritical,
          isLow,
        };
      });

      return `
        ${renderStationHeader(
          profile,
          'Control exclusivo de inventario físico de materiales de embalaje, consumo comprometido por línea y alertas de reposición.'
        )}

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-6">
          ${computedMaterials
            .map((mat) => {
              const cardBorder = mat.isCritical
                ? 'border-red-700 bg-red-50'
                : mat.isLow
                ? 'border-amber-600 bg-amber-50'
                : 'border-slate-800 bg-white';

              const statusTag = mat.isCritical
                ? '<span class="px-3 py-1 rounded-lg bg-red-700 text-white font-mono text-xs font-black">⛔ QUIEBRE DE STOCK — REPONER URGENTE</span>'
                : mat.isLow
                ? '<span class="px-3 py-1 rounded-lg bg-amber-500 text-slate-950 font-mono text-xs font-black">⚠️ ALERTA REPOSICIÓN (STOCK BAJO)</span>'
                : '<span class="px-3 py-1 rounded-lg bg-emerald-700 text-white font-mono text-xs font-black">✓ DISPONIBILIDAD ÓPTIMA</span>';

              const restockBatch = mat.code === 'INS-ETQ-QR' ? 10 : mat.code === 'INS-PLT-NIMF' ? 40 : 1000;

              return `
                <div class="border-4 rounded-2xl p-5 shadow-md flex flex-col justify-between ${cardBorder}">
                  <div>
                    <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
                      <span class="font-mono text-xs font-extrabold text-slate-600">${mat.code}</span>
                      ${statusTag}
                    </div>
                    <h3 class="text-xl font-black text-slate-950 mb-4">${mat.name}</h3>

                    <div class="grid grid-cols-3 gap-2.5 text-center mb-4">
                      <div class="p-3 rounded-xl bg-slate-900 text-white">
                        <span class="block text-[11px] font-bold uppercase text-slate-300">Stock Físico</span>
                        <span class="font-mono text-lg sm:text-xl font-black">${formatKg(mat.physicalStock)}</span>
                        <span class="block text-[11px] text-slate-400">${mat.unit}</span>
                      </div>
                      <div class="p-3 rounded-xl bg-slate-200 border-2 border-slate-400 text-slate-950">
                        <span class="block text-[11px] font-bold uppercase text-slate-600">Comprometido</span>
                        <span class="font-mono text-lg sm:text-xl font-black text-amber-800">${formatKg(mat.committed)}</span>
                        <span class="block text-[11px] text-slate-600">${mat.unit}</span>
                      </div>
                      <div class="p-3 rounded-xl border-2 ${
                        mat.isCritical
                          ? 'bg-red-700 border-red-950 text-white'
                          : mat.isLow
                          ? 'bg-amber-400 border-amber-800 text-slate-950'
                          : 'bg-emerald-700 border-emerald-950 text-white'
                      }">
                        <span class="block text-[11px] font-bold uppercase">Disponible</span>
                        <span class="font-mono text-lg sm:text-xl font-black">${formatKg(mat.available)}</span>
                        <span class="block text-[11px]">${mat.unit}</span>
                      </div>
                    </div>
                  </div>

                  <button
                    type="button"
                    onclick="handleRestockMaterial('${mat.code}', ${restockBatch})"
                    class="btn-industrial w-full rounded-xl bg-slate-900 hover:bg-slate-800 border-slate-950 text-white text-sm uppercase"
                  >
                    + INGRESAR REPOSICIÓN PROVEEDOR (+${formatKg(restockBatch)} ${mat.unit})
                  </button>
                </div>
              `;
            })
            .join('')}
        </div>

        <!-- Desglose de Compromiso por Órdenes de Proceso Activas -->
        <div class="bg-white border-4 border-slate-800 rounded-2xl p-5 shadow-md">
          <h3 class="text-lg font-black text-slate-950 mb-3">
            Consumo Comprometido por Órdenes de Proceso Activas (${appState.processOrders.length})
          </h3>
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="bg-slate-900 text-white font-mono text-xs uppercase">
                  <th class="p-3 rounded-tl-xl">Orden</th>
                  <th class="p-3">Lote Origen</th>
                  <th class="p-3">Formato Embalaje</th>
                  <th class="p-3 text-right rounded-tr-xl">Cajas / Bolsas Requeridas</th>
                </tr>
              </thead>
              <tbody class="divide-y-2 divide-slate-200 text-sm font-bold">
                ${appState.processOrders
                  .map(
                    (op) => `
                  <tr>
                    <td class="p-3 font-mono font-black text-blue-900">${op.id}</td>
                    <td class="p-3 font-mono">${op.lotId} (${op.variety})</td>
                    <td class="p-3">${op.boxFormat}</td>
                    <td class="p-3 text-right font-mono font-black">${formatKg(op.estimatedBoxes)} un.</td>
                  </tr>
                `
                  )
                  .join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    /* ==========================================================================
       VISTA PERFIL 6: CLIENTE EXPORTADOR (EXPORTADORA VALLE SUR S.A.)
       ========================================================================== */

    function renderExporterWorkspace() {
      const profile = getActiveProfile();
      const clientCompany = profile.exporterCompany || 'Exportadora Valle Sur S.A.';

      // Aislamiento estricto: filtra únicamente registros pertenecientes al cliente exportador autenticado
      const myLots = appState.receptions.filter((r) => r.exporter === clientCompany);
      const myPallets = appState.pallets.filter((p) => p.exporter === clientCompany);

      const acceptedKg = myLots
        .filter((l) => l.status === 'ACEPTADO')
        .reduce((acc, l) => acc + l.weightKg, 0);

      return `
        ${renderStationHeader(
          profile,
          'Portal externo exclusivo para consulta de trazabilidad, estado fitosanitario y ubicación de pallets en cámaras de frío.'
        )}

        <!-- Indicador de Sesión Privada del Exportador -->
        <div class="p-4 rounded-2xl bg-slate-950 border-4 border-sky-500 text-white mb-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
          <div>
            <span class="text-xs font-mono font-extrabold text-sky-400 uppercase">Cuenta Corporativa Autenticada</span>
            <p class="text-xl font-black">${clientCompany}</p>
          </div>
          <div class="grid grid-cols-3 gap-3 text-center font-mono">
            <div class="px-3 py-2 rounded-xl bg-slate-900 border border-slate-700">
              <span class="block text-[10px] text-slate-400">MIS LOTES</span>
              <span class="text-lg font-black text-white">${myLots.length}</span>
            </div>
            <div class="px-3 py-2 rounded-xl bg-slate-900 border border-slate-700">
              <span class="block text-[10px] text-slate-400">KG APROBADOS</span>
              <span class="text-lg font-black text-emerald-400">${formatKg(acceptedKg)}</span>
            </div>
            <div class="px-3 py-2 rounded-xl bg-slate-900 border border-slate-700">
              <span class="block text-[10px] text-slate-400">MIS PALLETS</span>
              <span class="text-lg font-black text-sky-400">${myPallets.length}</span>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
          <!-- Mis Lotes y Dictamen Fitosanitario -->
          <section class="lg:col-span-7 bg-white border-4 border-slate-800 rounded-2xl p-6 shadow-md space-y-4">
            <h2 class="text-xl font-black text-slate-950 border-b-2 border-slate-200 pb-3">
              Estado Fitosanitario de Mis Lotes (${myLots.length})
            </h2>

            <div class="space-y-4">
              ${myLots
                .map((lot) => {
                  const badge = {
                    ACEPTADO: 'bg-emerald-700 text-white',
                    OBSERVADO: 'bg-amber-500 text-slate-950',
                    RECHAZADO: 'bg-red-700 text-white',
                    PENDIENTE: 'bg-slate-700 text-white',
                  }[lot.status];

                  return `
                    <div class="p-4 rounded-2xl bg-slate-50 border-2 border-slate-400 space-y-2.5">
                      <div class="flex flex-wrap items-center justify-between gap-2">
                        <div>
                          <span class="font-mono text-lg font-black text-slate-950">${lot.id}</span>
                          <span class="ml-2 text-xs font-mono text-slate-600">Guía ${lot.guideNumber}</span>
                        </div>
                        <span class="px-3 py-1 rounded-lg font-mono text-xs font-black ${badge}">
                          ${lot.status}
                        </span>
                      </div>

                      <p class="text-base font-black text-slate-900">
                        ${lot.producer} • ${lot.variety} (${formatKg(lot.weightKg)} kg)
                      </p>

                      <div class="p-3 rounded-xl bg-white border border-slate-300 text-xs sm:text-sm font-semibold text-slate-800">
                        <strong>Dictamen Control de Calidad:</strong> ${lot.reason}
                      </div>

                      ${
                        lot.quality
                          ? `
                        <div class="flex flex-wrap gap-3 font-mono text-xs font-bold text-slate-700 pt-1">
                          <span>• °Brix: ${lot.quality.brix}</span>
                          <span>• Firmeza: ${lot.quality.firmness} Durofel</span>
                          <span>• Defectos: ${lot.quality.defectsPct}%</span>
                        </div>
                      `
                          : ''
                      }
                    </div>
                  `;
                })
                .join('')}
            </div>
          </section>

          <!-- Mis Pallets en Cámaras de Frío -->
          <section class="lg:col-span-5 bg-white border-4 border-slate-800 rounded-2xl p-6 shadow-md space-y-4">
            <h2 class="text-xl font-black text-slate-950 border-b-2 border-slate-200 pb-3">
              Mis Pallets en Frigorífico (${myPallets.length})
            </h2>

            ${
              myPallets.length === 0
                ? `<p class="text-sm text-slate-600 font-medium">No hay pallets terminados registrados aún.</p>`
                : `<div class="space-y-3">
                    ${myPallets
                      .map(
                        (p) => `
                      <div class="p-4 rounded-2xl bg-slate-900 text-white border-2 border-slate-700 space-y-2">
                        <div class="flex items-center justify-between">
                          <span class="font-mono text-lg font-black text-sky-400">${p.id}</span>
                          <span class="px-2.5 py-0.5 rounded bg-emerald-700 text-white font-mono text-xs font-bold">
                            ${p.boxes} cajas • ${formatKg(p.netWeightKg)} kg
                          </span>
                        </div>
                        <p class="text-sm font-bold text-slate-200">${p.variety} • Lote ${p.lotId}</p>
                        <div class="p-2.5 rounded-xl bg-slate-800 border border-slate-600 font-mono text-xs">
                          <span class="text-slate-400 block">UBICACIÓN ACTUAL EN CÁMARA:</span>
                          <span class="text-emerald-300 font-black text-sm">${p.location}</span>
                        </div>
                      </div>
                    `
                      )
                      .join('')}
                  </div>`
            }
          </section>
        </div>
      `;
    }

    /* ==========================================================================
       PIE DE PÁGINA: REGISTRO DE AUDITORÍA OPERATIVA EN VIVO
       ========================================================================== */

    function renderAuditFooter() {
      const open = appState.auditDrawerOpen;
      const levelStyles = {
        success: 'border-emerald-500 bg-emerald-950/50 text-emerald-100',
        danger: 'border-red-500 bg-red-950/60 text-red-100',
        warning: 'border-amber-500 bg-amber-950/50 text-amber-100',
        info: 'border-sky-500 bg-slate-900 text-slate-100',
      };

      return `
        <footer class="fixed bottom-0 inset-x-0 z-40 bg-slate-950 text-white border-t-4 border-sky-600 shadow-2xl">
          <div class="max-w-7xl mx-auto px-4">
            <div class="flex items-center justify-between py-2.5 gap-3">
              <div class="flex items-center gap-3">
                <span class="w-3 h-3 rounded-full bg-emerald-400 animate-ping"></span>
                <span class="font-extrabold text-xs sm:text-sm uppercase tracking-wider">
                  Bitácora de Auditoría de Planta en Vivo
                </span>
                <span class="px-2.5 py-0.5 rounded-lg bg-slate-800 border border-slate-600 font-mono text-xs font-bold text-sky-300">
                  ${appState.auditLogs.length} registros
                </span>
              </div>

              <button
                type="button"
                onclick="toggleAuditFooter()"
                class="min-h-[48px] px-4 rounded-xl bg-slate-800 hover:bg-slate-700 border-2 border-slate-500 text-white font-extrabold text-xs uppercase flex items-center gap-2"
              >
                <span>${open ? 'OCULTAR BITÁCORA' : 'VER BITÁCORA'}</span>
                <svg class="w-4 h-4 transition-transform ${open ? 'rotate-180' : ''}" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7" />
                </svg>
              </button>
            </div>

            ${
              open
                ? `
              <div class="pb-4 pt-2 border-t border-slate-800 max-h-52 overflow-y-auto space-y-2 font-mono text-xs">
                ${appState.auditLogs
                  .map(
                    (log) => `
                  <div class="p-2.5 rounded-lg border-l-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-1 ${
                    levelStyles[log.level] || levelStyles.info
                  }">
                    <div class="flex flex-wrap items-center gap-2">
                      <span class="text-slate-400">[${log.time}]</span>
                      <span class="px-1.5 py-0.5 rounded bg-white/10 font-bold text-white">${log.module}</span>
                      <span class="font-extrabold uppercase">${log.event}:</span>
                      <span>${log.detail}</span>
                    </div>
                    <span class="text-[11px] text-slate-400 shrink-0">Operador: ${log.user}</span>
                  </div>
                `
                  )
                  .join('')}
              </div>
            `
                : ''
            }
          </div>
        </footer>
      `;
    }

    /* ==========================================================================
       ORQUESTADOR PRINCIPAL DE RENDERIZADO
       ========================================================================== */

    function render() {
      const root = document.getElementById('app-root');
      if (!root) return;

      if (!appState.isAuthenticated) {
        root.innerHTML = renderLoginScreen();
        return;
      }

      let workspaceContent = '';
      switch (appState.activeProfileId) {
        case 'admin':
          workspaceContent = renderAdminWorkspace();
          break;
        case 'quality':
          workspaceContent = renderQualityWorkspace();
          break;
        case 'operator':
          workspaceContent = renderOperatorWorkspace();
          break;
        case 'pda':
          workspaceContent = renderPdaWorkspace();
          break;
        case 'warehouse':
          workspaceContent = renderWarehouseWorkspace();
          break;
        case 'exporter':
          workspaceContent = renderExporterWorkspace();
          break;
        default:
          workspaceContent = renderAdminWorkspace();
      }

      root.innerHTML = `
        ${renderTopHeader()}
        <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6 pb-28">
          ${workspaceContent}
        </main>
        ${renderAuditFooter()}
      `;
    }

    window.addEventListener('DOMContentLoaded', () => {
      render();
    });
  </script>
</body>
</html>
